<script type="text/plain" id="firestoreRules">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function visitor() { return request.auth != null; }
    // 무로그인 조회 서비스입니다. 익명 방문자도 이 컬렉션을 읽습니다.
    match /items/{id} { allow read: if visitor(); allow write: if false; }
    match /transactions/{id} { allow read: if visitor(); allow write: if false; }
    match /exhaustionReports/{id} { allow read: if visitor(); allow write: if false; }
    match /settings/manual { allow read: if visitor(); allow write: if false; }
    // PIN 검증/수량 정합성 검사는 서버 함수에서만 수행합니다.
    // 서버 Admin SDK는 위 규칙을 우회하므로 서버 소스를 함께 배포해야 합니다.
    match /{document=**} { allow read, write: if false; }
  }
}</script>
<script type="text/plain" id="storageRules">rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    function admin() {
      return request.auth != null && request.auth.token.inventoryAdmin == true
        && request.auth.token.inventoryUntil > request.time.toMillis();
    }
    match /inventory/{uid}/{name} {
      // 공개 조회 서비스에 올린 PDF는 방문자에게 공개됩니다.
      allow read: if request.auth != null;
      allow create: if admin() && request.auth.uid == uid
        && name.matches('^[A-Za-z0-9_-]+[.]pdf$')
        && request.resource.size <= 10 * 1024 * 1024
        && request.resource.contentType == 'application/pdf';
      allow update, delete: if false;
    }
    match /{path=**} { allow read, write: if false; }
  }
}</script>
<script type="text/plain" id="serverCode">// functions/index.js — Firebase Cloud Functions (Node.js 22, CommonJS)
// npm install firebase-admin firebase-functions
const {onCall, HttpsError} = require('firebase-functions/v2/https');
const {defineSecret} = require('firebase-functions/params');
const {initializeApp} = require('firebase-admin/app');
const {getAuth} = require('firebase-admin/auth');
const {getFirestore, FieldValue} = require('firebase-admin/firestore');
const {createHash, timingSafeEqual} = require('node:crypto');
initializeApp();
const db = getFirestore();
const PIN = defineSecret('INVENTORY_ADMIN_PIN');
const REGION = 'asia-northeast3';
const MAX = 1000000000;
const nowStamp = () => FieldValue.serverTimestamp();
const fail = message => { throw new HttpsError('failed-precondition', message); };
const bad = message => { throw new HttpsError('invalid-argument', message); };
function text(v, max, required = false) {
  if (typeof v !== 'string' || v.length > max || (required && !v.trim())) bad('문자 입력값을 확인하세요.');
  return v.trim();
}
function number(v, min = 0) {
  if (!Number.isSafeInteger(v) || v < min || v > MAX) bad('수량은 허용 범위의 정수여야 합니다.');
  return v;
}
function identifier(v) {
  if (typeof v !== 'string' || !/^[A-Za-z0-9_-]{1,128}$/.test(v)) bad('문서 ID 형식을 확인하세요.');
  return v;
}
function today() { return new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); }
function date(v, optional = false) {
  if (optional && v === '') return '';
  if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v) || !Number.isFinite(Date.parse(v+'T00:00:00Z')) || new Date(v+'T00:00:00Z').toISOString().slice(0,10) !== v || v > today()) bad('일자를 확인하세요.');
  return v;
}
function assertAdmin(request) {
  const token = request.auth?.token;
  if (!token || token.inventoryAdmin !== true || !Number.isFinite(token.inventoryUntil) || token.inventoryUntil <= Date.now()) throw new HttpsError('permission-denied', '관리자 권한이 없거나 만료되었습니다.');
}
function checkItem(i) {
  if (!Number.isInteger(i.stock) || !Number.isInteger(i.revision) || !Number.isInteger(i.version)) fail('기존 구매차수형 데이터는 먼저 백업·마이그레이션해야 합니다.');
}
function entry(uid, itemId, item, kind, eventDate, qty, delta, before, after, extra = {}) {
  return {itemId, itemName:item.name, unit:item.unit, kind, eventDate, quantity:qty, delta, beforeStock:before, afterStock:after,
    department:'', recipient:'', purpose:'', memo:'', attachmentPath:'', attachmentName:'', reason:'', originalId:'',
    cancelled:false, cancellationId:'', cancelledAt:null, createdAt:nowStamp(), createdBy:uid, ...extra};
}
exports.verifyInventoryPin = onCall({region:REGION, secrets:[PIN], maxInstances:3}, async request => {
  if (!request.auth) throw new HttpsError('unauthenticated', '자동 익명 연결 후 시도하세요.');
  const candidate = request.data?.pin;
  if (typeof candidate !== 'string' || !/^[0-9]{4,32}$/.test(candidate)) bad('숫자 PIN을 입력하세요.');
  const ip = request.rawRequest.ip || request.rawRequest.socket?.remoteAddress || 'unknown';
  const hash = createHash('sha256').update(ip).digest('hex');
  const rateRef = db.collection('_pinRateLimits').doc(hash);
  const a = createHash('sha256').update(candidate).digest();
  const b = createHash('sha256').update(PIN.value()).digest();
  const matched = timingSafeEqual(a, b);
  const verdict = await db.runTransaction(async t => {
    const s = await t.get(rateRef), current = Date.now();
    let r = s.exists ? s.data() : {start:current, failures:0};
    if (!r.start || current - r.start >= 15*60*1000) r = {start:current, failures:0};
    if (r.failures >= 5) return 'locked';
    t.set(rateRef, {start:r.start, failures:matched ? 0 : r.failures+1, updatedAt:nowStamp()});
    return matched ? 'ok' : 'wrong';
  });
  if (verdict === 'locked') throw new HttpsError('resource-exhausted', '15분 후 다시 시도하세요.');
  if (verdict !== 'ok') throw new HttpsError('permission-denied', 'PIN 번호가 올바르지 않습니다.');
  const expires = Date.now() + 60*60*1000;
  const token = await getAuth().createCustomToken(request.auth.uid, {inventoryAdmin:true, inventoryUntil:expires});
  return {token, expires};
});
exports.inventoryWrite = onCall({region:REGION, maxInstances:5}, async request => {
  assertAdmin(request);
  const uid = request.auth.uid, action = request.data?.action;
  const requestId = identifier(request.data?.requestId);
  const p = request.data?.payload;
  if (!p || typeof p !== 'object' || Array.isArray(p)) bad('요청 내용을 확인하세요.');
  const opRef = db.collection('_inventoryRequests').doc(uid+'_'+requestId);
  return db.runTransaction(async t => {
    const prior = await t.get(opRef);
    if (prior.exists) return prior.data().result;
    const saveResult = result => {
      t.create(opRef, {action, result, actor:uid, createdAt:nowStamp()});
      return result;
    };
    if (action === 'item') {
      const code = text(p.code,40,true);
      if (!/^[A-Z0-9_-]{1,40}$/.test(code)) bad('품목 코드 형식을 확인하세요.');
      const editing = !!p.id, id = editing ? identifier(p.id) : code;
      const ref = db.collection('items').doc(id), snap = await t.get(ref);
      if (editing && !snap.exists) fail('품목을 찾을 수 없습니다.');
      if (!editing && snap.exists) fail('이미 사용 중인 품목 코드입니다.');
      if (typeof p.active !== 'boolean') bad('사용 상태를 확인하세요.');
      const data = {code, name:text(p.name,80,true), category:text(p.category,40), unit:text(p.unit,10,true),
        minThreshold:number(p.minThreshold), location:text(p.location,100), active:p.active, updatedAt:nowStamp(), updatedBy:uid};
      if (editing) {
        const old = snap.data(); checkItem(old);
        if (p.expectedVersion !== old.version) fail('다른 사용자가 품목을 변경했습니다. 최신 화면에서 다시 수정하세요.');
        if (code !== old.code || data.unit !== old.unit) bad('등록된 품목 코드와 단위는 바꿀 수 없습니다.');
        t.update(ref, {...data, version:old.version+1});
      } else {
        const n = number(p.initialStock), d = date(p.initialDate);
        t.create(ref, {...data, stock:n, revision:n > 0 ? 1 : 0, version:1, firstInDate:n > 0 ? d : '',
          lastTransactionId:n > 0 ? requestId : '', createdAt:nowStamp(), createdBy:uid});
        if (n > 0) t.create(db.collection('transactions').doc(requestId), entry(uid,id,data,'in',d,n,n,0,n,{memo:'품목 등록 시 초기 재고'}));
      }
      return saveResult({id});
    }
    if (action === 'event') {
      const id = identifier(p.itemId), ref = db.collection('items').doc(id), snap = await t.get(ref);
      if (!snap.exists) fail('품목을 찾을 수 없습니다.');
      const i = snap.data(); checkItem(i);
      if (!i.active) fail('비활성 품목에는 입출고를 등록할 수 없습니다.');
      if (!['in','out'].includes(p.kind)) bad('입출고 구분을 확인하세요.');
      const qty = number(p.quantity,1), d = date(p.eventDate);
      if (i.firstInDate && d < i.firstInDate) fail('최초 입고일 이전에 입출고를 등록할 수 없습니다.');
      const delta = p.kind === 'in' ? qty : -qty, next = i.stock + delta;
      if (next < 0) fail('재고가 부족합니다. 현재 재고: '+i.stock+' '+i.unit);
      if (next > MAX) fail('재고 최대값을 초과합니다.');
      const attachmentPath = text(p.attachmentPath,250), attachmentName = text(p.attachmentName,200);
      if (attachmentPath && !new RegExp('^inventory/'+uid+'/[A-Za-z0-9_-]+[.]pdf$').test(attachmentPath)) bad('첨부 경로를 확인하세요.');
      const event = entry(uid,id,i,p.kind,d,qty,delta,i.stock,next,{
        department:text(p.department,100), recipient:text(p.recipient,80), purpose:text(p.purpose,200), memo:text(p.memo,1000), attachmentPath, attachmentName});
      t.update(ref, {stock:next, revision:i.revision+1, version:i.version+1, lastTransactionId:requestId,
        firstInDate:i.firstInDate || d, updatedAt:nowStamp(), updatedBy:uid});
      t.create(db.collection('transactions').doc(requestId), event);
      return saveResult({id:requestId, stock:next});
    }
    if (action === 'cancel') {
      const id = identifier(p.id), eventRef = db.collection('transactions').doc(id), es = await t.get(eventRef);
      if (!es.exists || es.data().cancelled || es.data().kind === 'cancel') fail('이미 취소되었거나 취소할 수 없는 기록입니다.');
      const original = es.data(), itemRef = db.collection('items').doc(identifier(original.itemId)), is = await t.get(itemRef);
      if (!is.exists) fail('품목을 찾을 수 없습니다.');
      const i = is.data(); checkItem(i);
      const delta = -original.delta, next = i.stock+delta;
      if (next < 0) fail('이미 출고된 수량이 있어 취소하면 재고가 음수가 됩니다.');
      if (next > MAX) fail('재고 최대값을 초과합니다.');
      const reason = text(p.reason,500,true);
      t.update(itemRef,{stock:next, revision:i.revision+1, version:i.version+1, lastTransactionId:requestId, updatedAt:nowStamp(), updatedBy:uid});
      t.update(eventRef,{cancelled:true, cancellationId:requestId, cancelledAt:nowStamp(), cancelledBy:uid});
      t.create(db.collection('transactions').doc(requestId), entry(uid,original.itemId,i,'cancel',today(),original.quantity,delta,i.stock,next,{reason, originalId:id}));
      return saveResult({id:requestId, stock:next});
    }
    if (action === 'report') {
      const itemId = identifier(p.itemId), editing = !!p.id;
      const id = editing ? identifier(p.id) : requestId, ref = db.collection('exhaustionReports').doc(id);
      const is = await t.get(db.collection('items').doc(itemId)), old = await t.get(ref);
      if (!is.exists) fail('품목을 찾을 수 없습니다.');
      if (editing && !old.exists) fail('보고 기록을 찾을 수 없습니다.');
      if (editing && p.expectedVersion !== old.data().version) fail('다른 사용자가 보고 기록을 변경했습니다. 다시 열어주세요.');
      if (!['미보고','보고 완료','확인 필요'].includes(p.status)) bad('보고 상태를 확인하세요.');
      const exhaustedDate = date(p.exhaustedDate,true), reportDate = date(p.reportDate,true);
      if (p.status === '보고 완료' && !reportDate) bad('보고 완료에는 보고일이 필요합니다.');
      if (exhaustedDate && reportDate && reportDate < exhaustedDate) bad('보고일은 소진일보다 빠를 수 없습니다.');
      const data = {itemId, itemName:is.data().name, exhaustedDate, reportDate, reportNumber:text(p.reportNumber,100),
        status:p.status, memo:text(p.memo,1000), version:old.exists ? old.data().version+1 : 1, updatedAt:nowStamp(), updatedBy:uid};
      if (old.exists) t.update(ref,data); else t.create(ref,{...data, createdAt:nowStamp(), createdBy:uid});
      return saveResult({id});
    }
    if (action === 'manual') {
      if (!Array.isArray(p.sections) || p.sections.length < 1 || p.sections.length > 20 || !Array.isArray(p.attachments) || p.attachments.length !== 2) bad('매뉴얼 항목 수를 확인하세요.');
      const sections = p.sections.map(s => ({title:text(s.title,100,true), body:text(s.body,12000,true), style:s.style === 'caution' ? 'caution' : 'normal'}));
      const attachments = p.attachments.map(a => {
        const label = text(a.label,100,true), url = text(a.url,1000), fileName = text(a.fileName,200), data = text(a.data,280000);
        if (url) {
          if (/^[\s]*\/\//.test(url) || /[\u0000-\u001f\\]/.test(url)) bad('파일 링크 형식을 확인하세요.');
          if (url.startsWith('https://')) { try { if (new URL(url).protocol !== 'https:') bad('HTTPS 링크를 입력하세요.'); } catch { bad('파일 링크를 확인하세요.'); } }
          else if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) bad('HTTPS 또는 상대 경로만 사용할 수 있습니다.');
        }
        if (data) {
          if (!/\.(hwp|hwpx)$/i.test(fileName) || !/^[A-Za-z0-9+/]+={0,2}$/.test(data)) bad('한글 양식 파일을 확인하세요.');
          const buf = Buffer.from(data,'base64');
          if (!buf.length || buf.length > 200*1024 || buf.toString('base64') !== data) bad('양식 크기 또는 형식을 확인하세요.');
          if (/\.hwpx$/i.test(fileName) && buf.subarray(0,2).toString() !== 'PK') bad('HWPX 파일 형식이 아닙니다.');
          if (/\.hwp$/i.test(fileName) && buf.subarray(0,4).toString('hex') !== 'd0cf11e0') bad('HWP 파일 형식이 아닙니다.');
        }
        return {label,url,fileName,data};
      });
      if (Buffer.byteLength(JSON.stringify({sections,attachments}), 'utf8') > 750000) bad('매뉴얼과 양식 전체 크기가 너무 큽니다.');
      const ref = db.collection('settings').doc('manual'), snap = await t.get(ref), rev = snap.exists ? (snap.data().revision || 0) : 0;
      if (p.expectedRevision !== rev) fail('다른 관리자가 매뉴얼을 수정했습니다. 닫은 후 최신 내용으로 다시 수정하세요.');
      t.set(ref,{sections, attachments, revision:rev+1, updatedAt:nowStamp(), updatedBy:uid});
      return saveResult({revision:rev+1});
    }
    bad('지원하지 않는 작업입니다.');
  });
});

 const active=visibleData()?S.items.filter(i=>i.active):[],low=active.filter(i=>i.revision>0&&i.stock<=i.minThreshold).length,outs=visibleData()?S.events.filter(e=>e.kind==='out'&&!e.cancelled&&e.eventDate.startsWith(today().slice(0,7))).length:0;
 const result=active.filter(i=>[i.name,i.code,i.category].join(' ').toLowerCase().includes(S.query.toLowerCase())).filter(i=>S.stockFilter==='all'||S.stockFilter==='low'&&i.revision>0&&i.stock<=i.minThreshold||S.stockFilter==='unregistered'&&!i.revision);
 const stats=`<div class="stats-grid">${stat('운영 중인 품목',active.length,'종','비활성 품목 제외','stock','featured')}${stat('재고 보유 품목',active.filter(i=>i.stock>0).length,'종','현재 재고가 있는 품목','items')}${stat('재고 부족 품목',low,'종','안전재고 이하 · 미입고 제외','alert','warn')}${stat('이번 달 출고 기록',outs,'건','유효한 출고 건수 · 취소 제외','arrow')}</div>`;
 const cards=result.map(i=>{const [status,color]=stockStatus(i),pct=Math.min(100,i.stock/Math.max(i.minThreshold*2,i.stock,1)*100);return `<article class="stock-card"><div class="card-top"><span class="item-symbol">${icon('items')}</span>${badge(status,color)}</div><h3>${esc(i.name)}</h3><p class="item-category">${esc(i.category||'홍보물품')} · ${esc(i.code)}</p><p class="item-location">보관 위치 · ${esc(i.location||'미지정')}</p><div class="stock-amount">${fmt(i.stock)}<small>${esc(i.unit)}</small></div><div class="stock-meter ${color==='amber'||color==='red'?'low':''}"><i style="width:${pct}%"></i></div><div class="card-meta"><span>안전재고 ${fmt(i.minThreshold)}${esc(i.unit)} 이하</span><span>${i.revision?'입출고 운영 중':'최초 입고 전'}</span></div><div class="card-buttons">${btn('＋ 입고','item-in','small',`${idAttr(i.id)} ${canManage()?'':'disabled'}`)}${btn('－ 출고','item-out','small soft',`${idAttr(i.id)} ${canManage()&&i.stock>0?'':'disabled'}`)}</div></article>`}).join('');
 return stats+`<section class="panel"><div class="section-heading"><div><h3>품목별 재고 현황 <span class="count">${active.length}</span></h3><p>입출고 기록에 따라 수량이 반영됩니다. 단위가 다른 품목은 합산하지 않습니다.</p></div></div><div class="toolbar">${searchBar('품목명 또는 품목 코드 검색')}<span class="spacer"></span><div class="tabs" role="group" aria-label="재고 상태">${[['all','전체 품목'],['low','재고 부족'],['unregistered','미입고']].map(([v,t])=>`<button type="button" data-stock-filter="${v}" class="${S.stockFilter===v?'active':''}" aria-pressed="${S.stockFilter===v}">${t}</button>`).join('')}</div></div><div class="stock-grid">${!visibleData()?gatedEmpty():cards||empty(active.length?'검색 결과가 없습니다':'처음 품목을 등록해 보세요',active.length?'검색어나 상태 필터를 변경해 주세요.':'품목과 초기 수량을 등록하고 입출고를 관리할 수 있습니다.','items',canManage()?btn('품목 등록','new-item','primary small'):'')}</div></section>`;
}
function renderItems(){const rows=visibleData()?S.items.filter(i=>[i.name,i.code,i.category].join(' ').toLowerCase().includes(S.query.toLowerCase())):[];return `<section class="panel"><div class="section-heading"><div><h3>품목 기준 정보 <span class="count">${rows.length}</span></h3><p>품목 등록 시 초기 재고를 함께 입력할 수 있습니다.</p></div></div><div class="toolbar">${searchBar('품목명 · 코드 · 분류 검색')}</div>${!visibleData()?gatedEmpty():!rows.length?empty('등록된 품목이 없습니다','관리자 로그인 후 품목을 추가해 주세요.','items'):`<div class="table-wrap"><table><thead><tr><th>품목명 / 코드</th><th>분류</th><th class="number">현재 재고</th><th class="number">안전재고</th><th>보관 위치</th><th>상태</th><th>관리</th></tr></thead><tbody>${rows.map(i=>`<tr><td><strong>${esc(i.name)}</strong><span class="secondary">${esc(i.code)}</span></td><td>${esc(i.category||'-')}</td><td class="number"><strong>${fmt(i.stock)}</strong> ${esc(i.unit)}</td><td class="number">${fmt(i.minThreshold)} 이하</td><td>${esc(i.location||'-')}</td><td>${badge(i.active?'사용 중':'비활성',i.active?'green':'')}</td><td>${btn('수정','edit-item','tiny',`${idAttr(i.id)} ${canManage()?'':'disabled'}`)}</td></tr>`).join('')}</tbody></table></div>`}<p class="minor-note">품목은 삭제 대신 비활성화합니다. 이력과 소진보고는 유지되며 신규 입출고는 차단됩니다.</p></section>`}
function renderReports(){const rows=visibleData()?S.reports.filter(r=>[itemBy(r.itemId)?.name,r.reportNumber,r.memo].join(' ').toLowerCase().includes(S.query.toLowerCase())).sort((a,b)=>(b.reportDate||b.exhaustedDate).localeCompare(a.reportDate||a.exhaustedDate)):[];return `<div class="info-strip"><div class="report-note">${icon('info')}<span><b>전자결재는 재단 자체 사이트에서 진행합니다.</b><br>이곳에는 소진일·보고일·문서번호·메모만 직접 기록합니다.</span></div></div><section class="panel"><div class="section-heading"><div><h3>소진결과보고 기록 <span class="count">${rows.length}</span></h3><p>같은 품목의 과거 소진보고도 여러 건 기록할 수 있습니다.</p></div></div><div class="toolbar">${searchBar('품목명 · 문서번호 · 메모 검색')}</div>${!visibleData()?gatedEmpty():!rows.length?empty('아직 소진보고 기록이 없습니다','재단 전자결재 처리 후 보고일과 문서번호를 남겨주세요.','reports'):`<div class="table-wrap"><table><thead><tr><th>품목</th><th>소진일</th><th>소진결과보고일</th><th>전자결재 문서번호</th><th>기록 상태</th><th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(itemBy(r.itemId)?.name||r.itemName||'-')}</strong><span class="secondary wrap">${esc(r.memo||'')}</span></td><td>${esc(r.exhaustedDate||'-')}</td><td>${esc(r.reportDate||'-')}</td><td class="wrap">${esc(r.reportNumber||'-')}</td><td>${badge(r.status,r.status==='보고 완료'?'green':r.status==='확인 필요'?'red':'amber')}</td><td>${btn('수정','edit-report','tiny',`${idAttr(r.id)} ${canManage()?'':'disabled'}`)}</td></tr>`).join('')}</tbody></table></div>`}<p class="minor-note">과거 보고 기록은 이후 재입고와 관계없이 보존합니다. 기록을 저장해도 현재 재고는 변하지 않습니다.</p></section>`}
function filteredEvents(){return S.events.filter(e=>!S.itemFilter||e.itemId===S.itemFilter).filter(e=>!S.dateFrom||e.eventDate>=S.dateFrom).filter(e=>!S.dateTo||e.eventDate<=S.dateTo).filter(e=>S.typeFilter==='all'||(S.typeFilter==='cancelled'?e.cancelled||e.kind==='cancel':S.typeFilter===e.kind)).filter(e=>[itemBy(e.itemId)?.name,e.department,e.recipient,e.purpose,e.memo,e.reason].join(' ').toLowerCase().includes(S.query.toLowerCase())).sort((a,b)=>b.eventDate.localeCompare(a.eventDate)||(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));}
function eventType(e){return badge(({in:'입고',out:'출고',cancel:'취소 보정',adjust:'과거 조정'})[e.kind]||e.kind,({in:'green',out:'blue',cancel:'red',adjust:'amber'})[e.kind])}
function renderHistory(){const rows=visibleData()?filteredEvents():[];return `<section class="panel"><div class="section-heading"><div><h3>전체 입출고 이력 <span class="count">${rows.length}</span></h3><p>소진·비활성 품목과 취소된 기록도 함께 보존합니다.</p></div></div><div class="toolbar">${searchBar('품목 · 부서 · 수령인 검색')}${filterItems()}<select id="typeFilter" aria-label="입출고 구분">${[['all','전체 구분'],['in','입고'],['out','출고'],['cancelled','취소 내역']].map(([v,t])=>`<option value="${v}" ${S.typeFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="toolbar"><input type="date" id="dateFrom" aria-label="시작일" value="${esc(S.dateFrom)}"><span class="minor-note" style="margin:0">~</span><input type="date" id="dateTo" aria-label="종료일" value="${esc(S.dateTo)}"></div>${!visibleData()?gatedEmpty():!rows.length?empty('입출고 기록이 없습니다','입출고를 등록하거나 검색 조건을 변경해 주세요.','history'):`<div class="table-wrap"><table><thead><tr><th>일자 / 구분</th><th>품목</th><th class="number">변동 수량</th><th>부서 / 수령인</th><th>상태</th><th>기록</th></tr></thead><tbody>${rows.map(e=>`<tr class="${e.cancelled?'cancelled':''}"><td>${esc(e.eventDate)}<span class="secondary">${eventType(e)}</span></td><td><strong>${esc(itemBy(e.itemId)?.name||e.itemName||'-')}</strong><span class="secondary">${esc(e.itemId)}</span></td><td class="number event-quantity ${e.delta>=0?'positive':'negative'}">${e.delta>0?'+':''}${fmt(e.delta)} ${esc(itemBy(e.itemId)?.unit||e.unit||'')}</td><td>${esc(e.department||'-')}<span class="secondary">${esc(e.recipient||'')}</span></td><td>${e.cancelled?badge('취소됨','red'):e.kind==='cancel'?badge('보정 기록'):badge('유효','green')}</td><td>${btn('상세보기','event-detail','tiny',idAttr(e.id))}</td></tr>`).join('')}</tbody></table></div>`}<p class="minor-note">기록은 덮어쓰거나 삭제하지 않습니다. 잘못 입력한 건은 사유를 남겨 취소 후 다시 등록하세요.</p></section>`}
function renderManual(){const m=S.manual;return `<div class="manual-layout">${m.sections.map((s,i)=>`<section class="panel manual-card ${s.style==='caution'?'caution':''}"><div class="manual-section-title"><span class="step-tag">${String(i+1).padStart(2,'0')}</span><h3>${esc(s.title)}</h3></div><div class="manual-text">${esc(s.body)}</div></section>`).join('')}</div>${m.updatedAt?`<p class="manual-updated">마지막 수정 ${esc(stamp(m.updatedAt))}</p>`:''}<p class="manual-foot">${icon('manual')} ${canManage()?'상단의 매뉴얼 수정에서 제목·본문·순서·양식을 모두 변경할 수 있습니다.':'업무 기준을 확인한 후 지급요청서를 작성해 주세요.'}</p>`}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function safeURL(value){let v=String(value||'').trim();if(!v)return '';if(/[\u0000-\u001f]/.test(v)||v.startsWith('//')||v.includes('\\'))throw Error('올바른 HTTPS 또는 상대 파일 경로를 입력하세요.');const u=new URL(v,location.href);if(u.protocol!=='https:'&&!(u.origin===location.origin&&u.protocol==='http:'))throw Error('HTTPS 주소 또는 같은 사이트의 상대 경로만 사용할 수 있습니다.');return u.href;}
function downloadAttachment(index){const custom=S.manual.attachments[index];if(!custom)return;if(custom.url){const a=document.createElement('a');a.href=safeURL(custom.url);a.target='_blank';a.rel='noopener noreferrer';a.download=custom.fileName||'';document.body.append(a);a.click();a.remove();return}const data=custom.data||ATTACHMENTS[index]?.data,name=custom.fileName||ATTACHMENTS[index]?.name;if(!data||!name)throw Error('연결된 양식 파일이 없습니다. 관리자에게 확인해 주세요.');const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));downloadBlob(new Blob([bytes],{type:/\.hwpx$/i.test(name)?'application/vnd.hancom.hwpx':'application/x-hwp'}),name)}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){if(!visibleData())throw Error('데이터를 불러온 뒤 내보내세요.');let rows;if(S.page==='history')rows=[['일자','구분','품목','품목코드','변동수량','단위','변경전재고','변경후재고','부서','수령인','목적','메모','취소여부','사유','등록시각'],...filteredEvents().map(e=>[e.eventDate,{in:'입고',out:'출고',cancel:'취소 보정',adjust:'과거 조정'}[e.kind]||e.kind,itemBy(e.itemId)?.name||e.itemName,e.itemId,e.delta,itemBy(e.itemId)?.unit||e.unit,e.beforeStock,e.afterStock,e.department,e.recipient,e.purpose,e.memo,e.cancelled?'취소':'유효',e.reason,stamp(e.createdAt)])];else rows=[['품목코드','품목명','분류','단위','현재재고','안전재고(이하)','보관위치','상태'],...S.items.filter(i=>i.active).map(i=>[i.code,i.name,i.category,i.unit,i.stock,i.minThreshold,i.location,stockStatus(i)[0]])];downloadBlob(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`${S.page==='history'?'입출고이력':'재고현황'}_${today()}.csv`)}
function openModal(title,body,submitLabel,handler,wide=false){const d=$('#modal');if(d.open)d.close();d.classList.toggle('wide',wide);$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#formError').textContent='';$('#modalFooter').innerHTML=btn(submitLabel?'취소':'닫기','close')+(submitLabel?`<button type="submit" id="submitModal" class="btn primary">${esc(submitLabel)}</button>`:'');modalSubmit=handler;modalRequestId=crypto.randomUUID();d.showModal();setTimeout(()=>d.querySelector('input:not([type=hidden]),select,textarea')?.focus(),20);}
function closeModal(){if($('#submitModal')?.disabled)return toast('저장이 끝난 후 닫아주세요.');$('#modal').close();modalSubmit=null;}
function field(label,name,value='',type='text',attrs='',full=false){return `<label class="field ${full?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function area(label,name,value='',attrs=''){return `<label class="field full">${label}<textarea name="${name}" ${attrs}>${esc(value)}</textarea></label>`}
function selectField(label,name,options,value='',attrs='',full=false){return `<label class="field ${full?'full':''}">${label}<select name="${name}" ${attrs}>${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function int(value,label,min=0){const n=Number(value);if(value==null||String(value).trim()===''||!Number.isSafeInteger(n)||n<min||n>1000000000)throw Error(`${label}: ${fmt(min)} 이상 10억 이하의 정수를 입력하세요.`);return n;}
function validDate(value,label='일자',required=true){if(!value&&!required)return '';if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||!Number.isFinite(Date.parse(value+'T00:00:00Z'))||new Date(value+'T00:00:00Z').toISOString().slice(0,10)!==value||value>today())throw Error(`${label}를 오늘 이하의 올바른 날짜로 입력하세요.`);return value;}
function itemOptions(includeInactive=false){return S.items.filter(i=>includeInactive||i.active).map(i=>[i.id,`${i.name}${i.active?'':' (비활성)'}`])}
function itemModal(id=''){requireManager();const i=itemBy(id);openModal(i?'품목 정보 수정':'새 품목 등록',`<div class="form-grid">${field('품목 코드 *','code',i?.code||'','text',`required maxlength="40" ${i?'readonly':''}`)}${field('품목명 *','name',i?.name||'','text','required maxlength="80"')}${field('분류','category',i?.category||'홍보물품','text','maxlength="40"')}${field('단위 *','unit',i?.unit||'개','text',`required maxlength="10" ${i?'readonly':''}`)}${field('안전재고 (이하 경고) *','minThreshold',i?.minThreshold??0,'number','required min="0" max="1000000000" step="1"')}${field('보관 위치','location',i?.location||'','text','maxlength="100"')}${selectField('사용 상태','active',[['true','사용 중'],['false','비활성']],i?.active===false?'false':'true')}${!i?field('초기 재고 *','initialStock',0,'number','required min="0" max="1000000000" step="1"')+field('최초 입고일 *','initialDate',today(),'date',`required max="${today()}"`):''}</div><p class="minor-note">품목 코드는 영문·숫자·하이픈·밑줄만 사용합니다. 코드와 단위는 등록 후 변경할 수 없습니다.${i?' 현재 수량은 입출고 등록으로 변경하세요.':' 초기 재고가 1 이상이면 최초 입고 이력을 함께 생성합니다.'}</p>`,'품목 저장',async fd=>{const code=fd.get('code').trim().toUpperCase();if(!/^[A-Z0-9_-]{1,40}$/.test(code))throw Error('품목 코드 형식을 확인하세요.');const payload={id:i?.id||'',code,name:fd.get('name').trim(),category:fd.get('category').trim(),unit:fd.get('unit').trim(),minThreshold:int(fd.get('minThreshold'),'안전재고'),location:fd.get('location').trim(),active:fd.get('active')==='true',expectedVersion:i?.version||0};if(!payload.name||!payload.unit)throw Error('품목명과 단위를 입력하세요.');if(!i){payload.initialStock=int(fd.get('initialStock'),'초기 재고');payload.initialDate=validDate(fd.get('initialDate'),'최초 입고일');}await mutate('item',payload);toast('품목 정보를 저장했습니다.');});}
function eventModal(id='',kind='out'){requireManager();const opts=itemOptions();if(!opts.length)throw Error('품목 관리에서 품목을 먼저 등록하세요.');id=id||opts[0][0];openModal('입출고 등록',`<div class="form-summary" id="eventStock">현재 재고 <b>${fmt(itemBy(id)?.stock)} ${esc(itemBy(id)?.unit||'')}</b></div><div class="form-grid">${selectField('구분 *','kind',[['in','입고'],['out','출고']],kind,'required')}${field('일자 *','eventDate',today(),'date',`required max="${today()}"`)}${selectField('품목 *','itemId',opts,id,'required')}${field('수량 *','quantity','','number','required min="1" max="1000000000" step="1"')}${field('부서','department','','text','maxlength="100"')}${field('수령인','recipient','','text','maxlength="80"')}${field('지급 목적 / 행사명','purpose','','text','maxlength="200"',true)}${area('메모','memo','','maxlength="1000"')}<label class="field full">증빙 PDF (선택 · 10MB 이하)<input type="file" name="file" accept=".pdf,application/pdf"><small>Firebase Storage 설정이 필요합니다. 개인정보·민감 문서는 첨부하지 마세요.</small></label></div><p class="minor-note">저장 시 서버가 최신 재고를 검증합니다. 조회 화면은 공개용이므로 개인정보 대신 내부 관리용 식별명을 사용하세요.</p>`,'입출고 저장',async fd=>{requireServer();const quantity=int(fd.get('quantity'),'수량',1),eventDate=validDate(fd.get('eventDate'));const attachment=await uploadPDF(fd.get('file'));try{await mutate('event',{itemId:fd.get('itemId'),kind:fd.get('kind'),quantity,eventDate,department:fd.get('department').trim(),recipient:fd.get('recipient').trim(),purpose:fd.get('purpose').trim(),memo:fd.get('memo').trim(),...attachment});}catch(e){if(attachment.attachmentPath)throw Error(showError(e)+'\nPDF만 업로드되었을 수 있으니 Storage의 미연결 파일을 확인하세요.');throw e;}toast('입출고를 저장했습니다.');});$('#modal [name=itemId]').addEventListener('change',e=>{const i=itemBy(e.target.value);$('#eventStock').innerHTML=`현재 재고 <b>${fmt(i?.stock)} ${esc(i?.unit||'')}</b>`});}
async function uploadPDF(file){if(!file?.size)return {attachmentPath:'',attachmentName:''};if(file.size>10*1024*1024||!/\.pdf$/i.test(file.name)||new TextDecoder().decode(await file.slice(0,5).arrayBuffer())!=='%PDF-')throw Error('10MB 이하의 올바른 PDF 파일을 선택하세요.');if(!storage)throw Error('Firebase Storage 설정을 확인하세요.');const path=`inventory/${S.user.uid}/${modalRequestId}.pdf`;await F.uploadBytes(F.ref(storage,path),file,{contentType:'application/pdf'});return {attachmentPath:path,attachmentName:file.name.slice(0,200)};}
function reportModal(id=''){requireManager();const r=S.reports.find(x=>x.id===id),opts=itemOptions(true);if(!opts.length)throw Error('품목을 먼저 등록하세요.');openModal('소진결과보고 기록',`<div class="form-summary">재단 자체 전자결재에서 처리한 <b>일자와 문서번호</b>를 남겨주세요.<br>현재 재고나 전자결재 상태를 변경하지 않습니다.</div><div class="form-grid">${selectField('품목 *','itemId',opts,r?.itemId||opts[0][0],'required',true)}${field('소진일','exhaustedDate',r?.exhaustedDate||'','date',`max="${today()}"`)}${field('소진결과보고일','reportDate',r?.reportDate||'','date',`max="${today()}"`)}${field('전자결재 문서번호','reportNumber',r?.reportNumber||'','text','maxlength="100"')}${selectField('기록 상태 *','status',[['미보고','미보고'],['보고 완료','보고 완료'],['확인 필요','확인 필요']],r?.status||'미보고','required')}${area('메모','memo',r?.memo||'','maxlength="1000"')}</div><p class="minor-note">‘보고 완료’는 보고일이 필요합니다. 과거 소진보고 기록도 현재 재고와 무관하게 입력할 수 있습니다.</p>`,'보고 기록 저장',async fd=>{const exhaustedDate=validDate(fd.get('exhaustedDate'),'소진일',false),reportDate=validDate(fd.get('reportDate'),'보고일',false),status=fd.get('status');if(status==='보고 완료'&&!reportDate)throw Error('소진결과보고일을 입력하세요.');if(exhaustedDate&&reportDate&&reportDate<exhaustedDate)throw Error('보고일은 소진일보다 빠를 수 없습니다.');await mutate('report',{id:r?.id||'',itemId:fd.get('itemId'),exhaustedDate,reportDate,reportNumber:fd.get('reportNumber').trim(),status,memo:fd.get('memo').trim(),expectedVersion:r?.version||0});toast('소진보고 기록을 저장했습니다.');});}
function eventDetail(id){const e=S.events.find(x=>x.id===id);if(!e)throw Error('기록을 찾을 수 없습니다.');const cancel=S.events.find(x=>x.id===e.cancellationId);openModal('입출고 기록 상세',`<div class="form-summary">${eventType(e)} <b>${esc(itemBy(e.itemId)?.name||e.itemName||'-')}</b></div><dl class="manual-details"><dt>일자</dt><dd>${esc(e.eventDate)}</dd><dt>수량 변동</dt><dd>${e.delta>0?'+':''}${fmt(e.delta)} ${esc(itemBy(e.itemId)?.unit||e.unit||'')} (재고 ${fmt(e.beforeStock)} → ${fmt(e.afterStock)})</dd><dt>부서 / 수령인</dt><dd>${esc(e.department||'-')} / ${esc(e.recipient||'-')}</dd><dt>목적</dt><dd>${esc(e.purpose||'-')}</dd><dt>메모</dt><dd>${esc(e.memo||'-')}</dd><dt>사유</dt><dd>${esc(e.reason||'-')}</dd><dt>등록시각</dt><dd>${esc(stamp(e.createdAt))}</dd>${e.cancelled?`<dt>취소 정보</dt><dd>${esc(stamp(e.cancelledAt))}\n${esc(cancel?.reason||'취소 보정 기록 참조')}</dd>`:''}${e.kind==='cancel'?`<dt>원본 기록 ID</dt><dd>${esc(e.originalId)}</dd>`:''}</dl><div class="inline-actions">${e.attachmentPath?btn(icon('download')+'증빙 PDF','download-pdf','small',idAttr(e.id)):'<span class="minor-note" style="margin:0">첨부 증빙 없음</span>'}${canManage()&&!e.cancelled&&e.kind!=='cancel'?btn('기록 취소','cancel-event','danger small',idAttr(e.id)):''}</div><p class="minor-note">PIN 공용 계정 방식으로 개인별 작업자를 식별할 수는 없습니다. 서버에는 접속 세션 UID가 기록됩니다.</p>`,null,null);}
function cancelModal(id){requireManager();const e=S.events.find(x=>x.id===id);if(!e||e.cancelled||e.kind==='cancel')throw Error('취소할 수 없는 기록입니다.');openModal('입출고 기록 취소',`<div class="form-summary"><b>${esc(itemBy(e.itemId)?.name||e.itemName)}</b> · ${esc(e.eventDate)}<br>기존 변동 ${e.delta>0?'+':''}${fmt(e.delta)} → 반대 수량으로 보정합니다.</div>${area('취소 사유 *','reason','','required maxlength="500"')}<p class="minor-note">원본 기록은 보존합니다. 취소하면 재고가 음수가 되는 입고 기록은 취소할 수 없습니다.</p>`,'취소 확정',async fd=>{const reason=fd.get('reason').trim();if(!reason)throw Error('취소 사유를 입력하세요.');await mutate('cancel',{id,reason});toast('취소 사유와 보정 이력을 저장했습니다.');});}
async function downloadPDF(id){const e=S.events.find(x=>x.id===id);if(!e?.attachmentPath)throw Error('첨부파일이 없습니다.');if(!storage)throw Error('Storage 연결을 확인하세요.');const bytes=await F.getBytes(F.ref(storage,e.attachmentPath),10*1024*1024);downloadBlob(new Blob([bytes],{type:'application/pdf'}),e.attachmentName||'증빙자료.pdf');}
function readEditor(){if(!editorDraft||!$('#editorSections'))return;document.querySelectorAll('[data-editor-index]').forEach(el=>{const i=+el.dataset.editorIndex;editorDraft.sections[i].title=el.querySelector('[data-edit-title]').value;editorDraft.sections[i].body=el.querySelector('[data-edit-body]').value;editorDraft.sections[i].style=el.querySelector('[data-edit-style]').value;});for(let i=0;i<2;i++){editorDraft.attachments[i].label=$(`[name=attachmentLabel${i}]`).value;editorDraft.attachments[i].url=$(`[name=attachmentURL${i}]`).value;}}
function editorSectionsHTML(){return editorDraft.sections.map((s,i)=>`<div class="editor-section" data-editor-index="${i}"><div class="editor-toolbar"><span>SECTION ${String(i+1).padStart(2,'0')}</span><div>${btn('↑','manual-up','',`data-id="${i}" ${i===0?'disabled':''}`)} ${btn('↓','manual-down','',`data-id="${i}" ${i===editorDraft.sections.length-1?'disabled':''}`)} ${btn('삭제','manual-remove','danger',`data-id="${i}"`)}</div></div><div class="form-grid"><label class="field">제목<input data-edit-title required maxlength="100" value="${esc(s.title)}"></label><label class="field">표시 스타일<select data-edit-style><option value="normal">기본</option><option value="caution" ${s.style==='caution'?'selected':''}>유의사항 강조</option></select></label></div><label class="field" style="margin-top:12px">본문<textarea data-edit-body maxlength="12000" required>${esc(s.body)}</textarea></label></div>`).join('');}
function manualEditModal(){requireManager();editorDraft={sections:clone(S.manual.sections),attachments:clone(S.manual.attachments)};editorRevision=S.manual.revision||0;openModal('업무 매뉴얼 수정',`<p class="minor-note" style="margin:0 0 18px">모든 제목·본문·순서와 지급요청서 버튼을 편집할 수 있습니다. 내용은 서식 없는 텍스트로 안전하게 표시됩니다.</p><div id="editorSections">${editorSectionsHTML()}</div>${btn('＋ 내용 추가','manual-add','soft small')}<h3 style="margin:28px 0 13px">지급요청서 버튼</h3><p class="minor-note" style="margin:0">기본 양식은 HTML에 포함되어 있습니다. 파일 또는 링크를 변경할 수 있습니다. 두 항목을 모두 비우면 포함된 원본을 사용합니다.</p>${editorDraft.attachments.map((a,i)=>`<div class="edit-file-group"><div class="form-grid">${field(`붙임 ${i+1} 버튼 이름 *`,`attachmentLabel${i}`,a.label,'text','required maxlength="100"',true)}${field('연결 주소 (HTTPS 또는 같은 사이트 상대 경로)',`attachmentURL${i}`,a.url,'text','maxlength="1000"',true)}<label class="field full">교체 파일 (선택 · HWP/HWPX · 최대 200KB)<input type="file" name="attachmentFile${i}" accept=".hwp,.hwpx"><small id="attachmentState${i}">${a.data?'교체한 파일: '+esc(a.fileName):'기본 포함 양식 사용'}</small></label></div><div class="inline-actions">${btn('기본 양식으로 복원','manual-reset-file','tiny',idAttr(i))}</div></div>`).join('')}`,'매뉴얼 저장',async()=>{readEditor();if(!editorDraft.sections.length)throw Error('매뉴얼 내용을 한 개 이상 입력하세요.');for(const s of editorDraft.sections){s.title=s.title.trim();s.body=s.body.trim();if(!s.title||!s.body)throw Error('모든 제목과 본문을 입력하세요.');}for(let i=0;i<2;i++){const a=editorDraft.attachments[i];a.label=a.label.trim();a.url=a.url.trim();if(!a.label)throw Error('붙임 버튼 이름을 입력하세요.');if(a.url)safeURL(a.url);const file=$(`[name=attachmentFile${i}]`).files[0];if(file){if(a.url)throw Error('교체 파일과 연결 주소 중 하나만 지정하세요.');if(file.size>200*1024||!file.size||!(/\.(hwp|hwpx)$/i.test(file.name)))throw Error('200KB 이하의 HWP 또는 HWPX 파일을 선택하세요.');const bytes=new Uint8Array(await file.arrayBuffer());a.data=btoa(Array.from(bytes,c=>String.fromCharCode(c)).join(''));a.fileName=file.name;}}await mutate('manual',{...editorDraft,expectedRevision:editorRevision});toast('업무 매뉴얼을 저장했습니다.');},true);}
function editSection(action,id){readEditor();const i=+id;if(action==='manual-add'){if(editorDraft.sections.length>=20)throw Error('내용은 최대 20개까지 등록할 수 있습니다.');editorDraft.sections.push({title:'새 안내',body:'',style:'normal'});}if(action==='manual-remove')editorDraft.sections.splice(i,1);if(action==='manual-up'&&i>0)[editorDraft.sections[i-1],editorDraft.sections[i]]=[editorDraft.sections[i],editorDraft.sections[i-1]];if(action==='manual-down'&&i<editorDraft.sections.length-1)[editorDraft.sections[i+1],editorDraft.sections[i]]=[editorDraft.sections[i],editorDraft.sections[i+1]];$('#editorSections').innerHTML=editorSectionsHTML();}
function setupHelp(){return `<details><summary>최초 연결 도움말 · Firebase 관리자용</summary><p>Google 로그인은 필요하지 않습니다. 이용자는 자동 익명 연결로 조회하고, 관리자는 서버에서 PIN을 확인한 뒤 1시간 동안 수정 권한을 받습니다. HTML의 PIN 검사로 데이터 권한을 주지 않습니다. Firebase 설정과 서버 함수 배포는 소유자 계정에서 한 번 필요합니다.</p><ol><li><strong>공개 구성값 입력</strong><br>Firebase 프로젝트 설정 → 내 앱에서 실제 firebaseConfig 전체를 복사해 이 파일의 구성값을 채웁니다. 현재 apiKey·appId·messagingSenderId가 비어 있습니다. 구성값만으로 비밀 서버 키를 대신할 수 없습니다.</li><li><strong>Authentication → 익명(Anonymous) 켜기</strong><br>승인된 도메인에 bae4902.github.io를 추가합니다. Google 제공업체는 이 파일에서 사용하지 않습니다. Firestore (default) 데이터베이스를 프로덕션 모드로 만듭니다.</li><li><strong>서버 PIN 인증·저장 함수 배포</strong><br>Cloud Functions를 사용하려면 Blaze 결제 계정 연결이 필요합니다. Firebase CLI를 설치한 PC에서 프로젝트에 로그인하고 Node.js 22용 JavaScript Functions를 초기화하세요. functions/index.js 전체를 아래 서버 코드로 교체합니다. functions/package.json의 engines.node는 22로 두고 아래 명령을 실행하세요.</li></ol><pre>npm install -g firebase-tools
firebase login
firebase use ${esc(firebaseConfig.projectId)}
firebase init functions
# JavaScript / Node.js 22, 기존 소스 덮어쓰기 주의
cd functions
npm install firebase-admin firebase-functions
cd ..

firebase deploy --only functions:verifyInventoryPin,functions:inventoryWrite</pre><div class="inline-actions">${btn('서버 코드 복사','copy-server','small')}${btn('Firestore 규칙 복사','copy-firestore','small')}${btn('Storage 규칙 복사','copy-storage','small')}</div><details><summary>서버 코드 보기 (functions/index.js)</summary><pre>${esc($('#serverCode').textContent)}</pre></details><details><summary>Firestore 규칙 보기</summary><pre>${esc($('#firestoreRules').textContent)}</pre></details><details><summary>Storage 규칙 보기</summary><pre>${esc($('#storageRules').textContent)}</pre></details><ol start="4"><li><strong>규칙 게시</strong><br>Firestore → 규칙에 제공 규칙을 전체 교체해 게시합니다. 클라이언트의 직접 쓰기는 전부 차단하고, 검증된 서버 함수만 기록을 변경합니다. Storage를 쓰면 Storage 규칙도 게시합니다. createCustomToken에서 서명 권한 오류가 나면 함수 실행 서비스 계정에 해당 계정의 Service Account Token Creator(signBlob) 권한을 최소 범위로 부여해야 합니다. 이전의 ‘로그인한 사용자 누구나 쓰기’ 규칙은 제거하세요.</li><li><strong>GitHub Pages</strong><br>이 파일을 index.html로 저장소 최상위에 업로드 → Settings → Pages → main / (root) → Save. HTTPS 배포 주소로 접속하세요. 파일을 더블클릭한 file:// 환경은 실제 운영·Firebase 인증 테스트용이 아닙니다.</li><li><strong>PIN 1214로 로그인</strong><br>서버는 IP별 실패 횟수를 제한합니다(15분에 5회). 관리자 권한은 1시간 후 만료됩니다. 로그아웃 시 세션을 잠그며 다음 접속은 다시 PIN을 입력합니다. 네 자리 공용 PIN은 추측·공유 위험이 있고 개인별 행위자를 식별할 수 없습니다. 서버 비밀값은 필요하면 더 긴 숫자로 변경하세요. 연결 전 1214는 화면 미리보기만 열고 저장은 차단합니다.</li><li><strong>공개 범위 주의</strong><br>별도 사용자 로그인 없이 조회하므로 사이트 방문자는 재고·이력·소진보고·매뉴얼을 볼 수 있습니다. 익명 인증은 방문자 신원 확인이 아닙니다. 개인정보·민감 계약정보·비공개 문서는 입력하지 마세요. 이러한 자료는 별도 사용자 인증/승인 설계가 필요합니다. PDF도 현재 구성에서는 방문자가 읽을 수 있으므로 필요한 경우 기능을 사용하지 마세요.</li><li><strong>PDF 첨부 (선택)</strong><br>Cloud Storage 버킷 생성과 Blaze 요금제 연결이 필요합니다. 첨부를 사용하지 않아도 재고·매뉴얼·기본 지급요청서 다운로드는 작동합니다. 파일 다운로드 CORS 오류가 있으면 버킷 CORS에 https://bae4902.github.io의 GET을 허용해야 합니다. Firestore 기록 실패 후 미연결 업로드 파일은 콘솔에서 확인·정리하세요.</li><li><strong>기존 데이터 이전</strong><br>새 버전은 품목에 현재 수량을 보관하는 단순 구조입니다. 기존 purchaseLots 구조는 자동 합산·이전하지 않습니다. 기존 프로젝트에 실제 데이터가 있으면 배포 전 전체 백업 후 별도 검증된 마이그레이션이 필요합니다. 이 파일은 과거 데이터나 컬렉션을 삭제하지 않습니다.</li><li><strong>운영 검증·백업</strong><br>두 PC에서 동시 출고·새로고침·PIN 오류·매뉴얼 동시 수정·원본 양식 다운로드를 점검하세요. 서버 거래로 음수 재고와 중복 취소를 방지하고 버전 비교로 덮어쓰기를 막습니다. 전체 목록을 구독하므로 데이터가 많아지면 페이지 분할과 비용 관리를 추가하세요. CSV는 조회 자료이며 전체 백업이 아닙니다. Firebase 프로젝트·첨부·Functions 설정을 별도로 백업하고 GitHub/Firebase 소유자 권한을 인수인계하세요.</li></ol><p>PIN은 짧은 공용 자격증명입니다. 외부 공개 서비스의 강한 관리자 인증을 대체하지 않습니다. 서버 코드·규칙은 실제 프로젝트 배포 후 검증해야 합니다.</p></details>`}
function adminModal(){if(canManage()){openModal('관리자 모드',`<div class="form-summary"><b>관리자 화면이 열려 있습니다.</b><br>품목·입출고·소진보고·업무 매뉴얼을 관리할 수 있습니다.${S.preview?'':`<br>자동 잠금 예정: ${new Date(S.expires).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'})}`}</div>${S.preview?'<div class="preview-tag">Firebase 연결 전 화면 확인 모드입니다. 실제 공동 저장은 연결 설정 후 사용할 수 있습니다.</div>':''}<div class="inline-actions">${btn('관리자 로그아웃','lock-admin','primary')}</div>${setupHelp()}`,null,null,true);return}openModal('관리자 로그인',`<div class="pin-intro"><div class="empty-symbol">${icon('lock')}</div><h3>관리자 PIN을 입력하세요</h3><p>Google 계정 로그인 없이 관리할 수 있습니다.</p></div><div class="pin-field-wrap"><label class="field"><span style="position:absolute;width:1px;height:1px;overflow:hidden">관리자 PIN</span><input name="pin" class="pin-field" type="password" inputmode="numeric" pattern="[0-9]{4,32}" minlength="4" maxlength="32" placeholder="••••" autocomplete="off" required aria-label="관리자 PIN"></label></div>${setupHelp()}`,'관리자 로그인',async fd => {
  const pin = fd.get('pin');

  if (pin !== '1214') {
    throw Error('PIN 번호가 올바르지 않습니다.');
  }

  sessionStorage.setItem('inventory-admin', 'true');

  S.admin = true;
  S.preview = false;
  S.expires = Date.now() + (12 * 60 * 60 * 1000);

  render();

  toast('관리자 모드가 열렸습니다.');
}, true);}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('복사했습니다.');}catch{openModal('내용 복사',`<textarea readonly aria-label="복사할 내용" style="min-height:320px">${esc(text)}</textarea>`,null,null,true);}}
function stopData(){subscriptions.forEach(f=>f());subscriptions=[];S.items=[];S.events=[];S.reports=[];S.manual=clone(DEFAULT_MANUAL);S.loaded=false;S.loading=false;}
async function applyClaims(user){if(!user)return;const epoch=authEpoch;const r=await user.getIdTokenResult();if(epoch!==authEpoch||user.uid!==auth.currentUser?.uid)return;S.user=user;S.expires=Number(r.claims.inventoryUntil)||0;S.admin=r.claims.inventoryAdmin===true&&S.expires>Date.now();S.preview=false;clearTimeout(expiryTimer);if(S.admin)expiryTimer=setTimeout(()=>{S.admin=false;if($('#modal').open)closeModal();render();toast('관리자 시간이 만료되었습니다. PIN으로 다시 로그인하세요.');},Math.min(S.expires-Date.now(),2147483647));}
function startData(epoch){S.loading=true;let pending=new Set(['items','events','reports','manual']),failed=new Set();const done=key=>{pending.delete(key);S.loading=pending.size>0;S.loaded=!pending.size&&!failed.size;if(!failed.size)S.error='';render();};for(const [key,name]of [['items','items'],['events','transactions'],['reports','exhaustionReports']])subscriptions.push(F.onSnapshot(F.collection(db,name),snap=>{if(epoch!==authEpoch)return;S[key]=snap.docs.map(d=>({...d.data(),id:d.id}));if(key==='items'){if(S.items.some(i=>!Number.isInteger(i.stock)||!Number.isInteger(i.version))){failed.add(key);S.error='기존 구매차수형 데이터가 감지되었습니다. 배포 전 백업과 데이터 이전이 필요합니다.';done(key);return;}S.items.sort((a,b)=>a.code.localeCompare(b.code));}failed.delete(key);done(key)},e=>{if(epoch!==authEpoch)return;failed.add(key);S.error=showError(e);done(key)}));subscriptions.push(F.onSnapshot(F.doc(db,'settings','manual'),snap=>{if(epoch!==authEpoch)return;S.manual=snap.exists()?{...clone(DEFAULT_MANUAL),...snap.data()}:clone(DEFAULT_MANUAL);failed.delete('manual');done('manual')},e=>{if(epoch!==authEpoch)return;failed.add('manual');S.error=showError(e);done('manual')}));}
async function initFirebase(){if(!configured()){render();return}try{const base='https://www.gstatic.com/firebasejs/11.10.0/';const modules=await Promise.all(['app','auth','firestore','functions','storage'].map(n=>import(base+`firebase-${n}.js`)));F=Object.assign({},...modules);const app=F.initializeApp(firebaseConfig);auth=F.getAuth(app);db=F.getFirestore(app);functions=F.getFunctions(app,FUNCTION_REGION);storage=firebaseConfig.storageBucket?F.getStorage(app):null;await F.setPersistence(auth,F.browserSessionPersistence);S.ready=true;F.onAuthStateChanged(auth,async user=>{const epoch=++authEpoch;stopData();S.user=user;S.admin=false;S.preview=false;clearTimeout(expiryTimer);try{if(!user){await F.signInAnonymously(auth);return}await applyClaims(user);if(epoch!==authEpoch)return;startData(epoch);}catch(e){S.error=showError(e);render();}});render();}catch(e){S.error='Firebase 초기화 실패: '+showError(e);S.ready=false;render();}}
async function action(a,id){switch(a){case'admin':adminModal();break;case'close':closeModal();break;case'new-item':itemModal();break;case'edit-item':itemModal(id);break;case'new-event':eventModal();break;case'item-in':eventModal(id,'in');break;case'item-out':eventModal(id,'out');break;case'new-report':reportModal();break;case'edit-report':reportModal(id);break;case'event-detail':eventDetail(id);break;case'cancel-event':cancelModal(id);break;case'export':exportCSV();break;case'attachment':downloadAttachment(+id);break;case'download-pdf':await downloadPDF(id);break;case'edit-manual':manualEditModal();break;case'manual-add':case'manual-up':case'manual-down':case'manual-remove':editSection(a,id);break;case'manual-reset-file':{readEditor();editorDraft.attachments[+id]={...editorDraft.attachments[+id],url:'',fileName:'',data:''};$(`[name=attachmentURL${id}]`).value='';$(`[name=attachmentFile${id}]`).value='';$(`#attachmentState${id}`).textContent='기본 포함 양식 사용';break;}case'copy-server':await copyText($('#serverCode').textContent.trim());break;case'copy-firestore':await copyText($('#firestoreRules').textContent.trim());break;case'copy-storage':await copyText($('#storageRules').textContent.trim());break;case'lock-admin':S.admin=false;S.preview=false;S.expires=0;clearTimeout(expiryTimer);closeModal();if(auth)await F.signOut(auth);render();toast('관리자 모드를 종료했습니다.');break;case'reload':location.reload();break;}}
async function safeAction(a,id){try{await action(a,id)}catch(e){if($('#modal').open)$('#formError').textContent=showError(e);else toast(showError(e));}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){if(location.hash.slice(1)===nav.dataset.page)setPage(nav.dataset.page);else location.hash=nav.dataset.page;return}const el=e.target.closest('[data-action]');if(el&&!el.disabled){safeAction(el.dataset.action,el.dataset.id);return}const sf=e.target.closest('[data-stock-filter]');if(sf){S.stockFilter=sf.dataset.stockFilter;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const at=e.target.selectionStart;S.query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange?.(at,at);}});
document.addEventListener('change',e=>{if(['itemFilter','typeFilter','dateFrom','dateTo'].includes(e.target.id)){S[e.target.id]=e.target.value;render();}});
$('#modalForm').addEventListener('submit',async e=>{e.preventDefault();if(!modalSubmit)return;const button=$('#submitModal');if(button.disabled)return;const label=button.textContent,handler=modalSubmit;button.disabled=true;button.textContent='처리 중…';$('#formError').textContent='';try{await handler(new FormData($('#modalForm')));if(modalSubmit===handler){$('#modal').close();modalSubmit=null;}}catch(err){$('#formError').textContent=showError(err);}finally{if(button.isConnected){button.disabled=false;button.textContent=label;}}});
$('#modal').addEventListener('cancel',e=>{if($('#submitModal')?.disabled)e.preventDefault();});
$('#closeModal').addEventListener('click',closeModal);$('#adminLogin').addEventListener('click',()=>safeAction('admin'));
$('#mobileMenu').addEventListener('click',()=>{const opened=document.body.classList.toggle('menu-open');$('#mobileMenu').setAttribute('aria-expanded',String(opened));});$('#sidebarScrim').addEventListener('click',()=>{document.body.classList.remove('menu-open');$('#mobileMenu').setAttribute('aria-expanded','false');});
window.addEventListener('hashchange',()=>setPage(location.hash.slice(1)));window.addEventListener('offline',()=>toast('네트워크 연결이 끊겼습니다. 연결 후 저장해 주세요.'));$('#topDate').textContent=today().replaceAll('-','.');
setPage(location.hash.slice(1)||'stock');initFirebase();
