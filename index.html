<script type="text/plain" id="firestoreRules">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    // 6자리 PIN은 Authentication 계정의 비밀번호로 설정합니다.
    // Firestore 규칙은 PIN 자체가 아니라 로그인된 계정을 확인합니다.
    function isAdmin() {
      return signedIn()
        && request.auth.token.get('email', '') == 'admin@k-medihub.local'
        && request.auth.token.firebase.sign_in_provider == 'password';
    }
    match /items/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /transactions/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /exhaustionReports/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /settings/manual { allow read: if signedIn(); allow write: if isAdmin(); }
    match /settings/itemNames { allow read: if signedIn(); allow write: if isAdmin(); }
    match /_inventoryRequests/{id} { allow read, write: if isAdmin(); }
    match /inventoryFiles/{fileId} {
      allow read: if signedIn();
      allow write: if isAdmin();
      match /chunks/{chunkId} {
        allow read: if signedIn();
        allow write: if isAdmin();
      }
    }
    match /{document=**} { allow read, write: if false; }
  }
}</script>

async function sha256(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');}

function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}

const zipCRC32=(()=>{const table=Uint32Array.from({length:256},(_,i)=>{let c=i;for(let j=0;j<8;j++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;return c>>>0;});return bytes=>{let c=0xffffffff;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0;};})();

 }

function exportRows(){
 const source=S.page==='history'?filteredEvents():S.events,collator=new Intl.Collator('ko-KR',{numeric:true});
 return source.filter(e=>['in','out'].includes(e.kind)&&!e.cancelled).map(e=>{
  const date=String(e.eventDate||''),name=itemBy(e.itemId)?.name||e.itemName||'이름 없는 물품';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date+'T00:00:00Z'))||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date)throw Error(name+': 일자 형식이 올바르지 않은 기록이 있습니다. 원본 기록을 확인해 주세요.');
  if(!Number.isSafeInteger(e.quantity)||e.quantity<0)throw Error(name+': 수량이 올바르지 않은 기록이 있습니다. 원본 기록을 확인해 주세요.');
  return {name,date,inQty:e.kind==='in'?e.quantity:0,outQty:e.kind==='out'?e.quantity:0,id:e.id||'',seconds:e.createdAt?.seconds||0};
 }).sort((a,b)=>collator.compare(a.name,b.name)||a.date.localeCompare(b.date)||a.seconds-b.seconds||a.id.localeCompare(b.id));
}

  ['xl/_rels/workbook.xml.rels',xml+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],

function openModal(t,body,label,handler,wide=false){const d=$('#modal');if(d.open)d.close();d.classList.toggle('wide',wide);$('#modalTitle').textContent=t;$('#modalBody').innerHTML=body;$('#formError').textContent='';$('#modalFooter').innerHTML=btn(label?'취소':'닫기','close')+(label?`<button type="submit" id="submitModal" class="btn primary">${esc(label)}</button>`:'');modalSubmit=handler;requestMap=new Map();pdfCache=null;d.showModal();setTimeout(()=>d.querySelector('input:not([type=hidden]),select,textarea')?.focus(),20);}
function closeModal(){if($('#submitModal')?.disabled)return toast('처리가 끝난 후 닫아주세요.');$('#modal').close();modalSubmit=null;}
function field(label,name,v='',type='text',attrs='',full=false){return `<label class="field ${full?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(v)}" ${attrs}></label>`;}
function area(label,name,v='',attrs=''){return `<label class="field full">${label}<textarea name="${name}" ${attrs}>${esc(v)}</textarea></label>`;}
function selectField(label,name,opts,value='',attrs='',full=false){return `<label class="field ${full?'full':''}">${label}<select name="${name}" ${attrs}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;}
function int(v,label,min=0){const n=Number(v);if(v==null||!String(v).trim()||!Number.isSafeInteger(n)||n<min||n>1000000000)throw Error(label+': '+fmt(min)+' 이상 10억 이하의 정수를 입력하세요.');return n;}
function validDate(v,label='일자',required=true){if(!v&&!required)return '';if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||!Number.isFinite(Date.parse(v+'T00:00:00Z'))||new Date(v+'T00:00:00Z').toISOString().slice(0,10)!==v||v>today())throw Error(label+'를 오늘 이하의 올바른 날짜로 입력하세요.');return v;}
function itemOptions(all=false){return S.items.filter(i=>all||i.active).map(i=>[i.id,i.name+(i.active?'':' (비활성)')]);}
function itemModal(id=''){requireManager();const i=itemBy(id),code=i?.code||'ITM_'+uuid().replaceAll('-','').toUpperCase(),list=names();if(i?.name&&!list.includes(i.name))list.unshift(i.name);const opts=[['','물품명을 선택하세요'],...list.map(n=>[n,n+(i&&n===i.name&&S.names!==null&&!S.names.includes(n)?' (기존 등록명)':'')])];openModal(i?'물품 정보 수정':'물품 등록',`<div class="form-summary">물품명은 <b>등록된 목록에서 선택</b>합니다. 신규 수량의 기준은 <b>개</b>입니다.<br>물품명 추가·수정·삭제는 물품 관리 상단의 ‘물품명 목록 관리’에서 할 수 있습니다.</div><div class="form-grid">${selectField('물품명 *','name',opts,i?.name||'','required',true)}${field('안전재고 (이하 경고) *','minThreshold',i?.minThreshold??0,'number','required min="0" max="1000000000" step="1"')}${field('보관 위치','location',i?.location||'','text','maxlength="100"')}${selectField('사용 상태','active',[['true','사용 중'],['false','비활성']],i?.active===false?'false':'true')}${!i?field('초기 재고 (개) *','initialStock',0,'number','required min="0" max="1000000000" step="1"')+field('최초 입고일 *','initialDate',today(),'date',`required max="${today()}"`):''}</div>${!list.length?'<div class="info-strip warning" style="margin-top:18px">선택 가능한 물품명이 없습니다. 창을 닫고 ‘물품명 목록 관리’에서 물품명을 먼저 추가해 주세요.</div>':''}${i&&i.unit!=='개'?`<div class="info-strip warning" style="margin-top:18px">이 기존 물품의 단위는 ‘${esc(i.unit)}’입니다. 과거 수량의 의미를 바꾸지 않도록 그대로 보존합니다. ‘개’로의 환산은 백업·환산 기준 확인 후 별도 이전이 필요합니다.</div>`:''}<p class="minor-note">${i?'현재 재고는 입출고 등록으로 변경하세요.':'초기 재고가 1 이상이면 최초 입고 이력을 함께 생성합니다.'} 시스템 식별자는 자동 생성되며 입력할 필요가 없습니다.</p>`,'물품 저장',async fd=>{const name=String(fd.get('name')||'');if(!name||!list.includes(name))throw Error('목록에서 물품명을 선택하세요.');const payload={id:i?.id||'',code,name,category:i?.category||'',unit:i?.unit||'개',minThreshold:int(fd.get('minThreshold'),'안전재고'),location:fd.get('location').trim(),active:fd.get('active')==='true',expectedVersion:i?.version||0};if(!i){payload.initialStock=int(fd.get('initialStock'),'초기 재고');payload.initialDate=validDate(fd.get('initialDate'),'최초 입고일');}await mutate('item',payload);toast('물품 정보를 저장했습니다.');});}
function readCatalogDraft(){document.querySelectorAll('[data-catalog-index]').forEach(e=>catalogDraft[+e.dataset.catalogIndex]=e.value);}
function catalogHTML(){return catalogDraft.length?catalogDraft.map((n,i)=>`<div class="name-row"><span class="badge">${i+1}</span><input data-catalog-index="${i}" aria-label="물품명 ${i+1}" value="${esc(n)}" maxlength="80" required>${btn('삭제','catalog-remove','danger small',idAttr(i))}</div>`).join(''):'<p class="minor-note">등록된 선택지가 없습니다. 아래에서 물품명을 추가하세요.</p>';}
function catalogModal(){requireManager();catalogDraft=names();catalogRevision=S.catalogRevision;openModal('물품명 목록 관리',`<div class="form-summary">이 화면에서 관리자가 물품명을 <b>추가·수정·삭제</b>할 수 있습니다.<br>저장한 목록은 서버에 공동 저장되고 물품 등록 창의 선택지에 반영됩니다.</div>${S.catalogStatus==='unavailable'?'<div class="info-strip warning">물품명 목록을 읽을 수 없습니다. 관리자 모드 → 무료 연결 도움말의 Firestore 규칙을 게시하세요. 브라우저에만 임시 저장하지 않습니다.</div>':''}<div id="catalogRows">${catalogHTML()}</div><div class="catalog-add"><input id="newCatalogName" aria-label="추가할 물품명" maxlength="80" placeholder="추가할 물품명을 입력하세요">${btn('＋ 물품명 추가','catalog-add','soft')}</div><p class="minor-note">최대 200개 · 물품명당 80자. 목록 삭제·이름 변경은 기존 재고·이력에 소급 적용하지 않습니다. 빈 목록도 저장할 수 있지만 이후 신규 등록은 물품명을 추가해야 가능합니다.</p>`,'목록 저장',async()=>{readCatalogDraft();if($('#newCatalogName').value.trim())throw Error('입력한 새 물품명은 ‘물품명 추가’를 먼저 눌러 목록에 넣어주세요.');const list=catalogDraft.map(n=>n.trim());if(list.some(n=>!n||n.length>80))throw Error('빈 물품명을 삭제하거나 올바른 이름을 입력하세요.');if(new Set(list).size!==list.length)throw Error('중복된 물품명이 있습니다.');const result=await mutate('catalog',{names:list,expectedRevision:catalogRevision});S.names=list;S.catalogRevision=result.revision;S.catalogStatus='ready';render();toast('물품명 목록을 공동 저장했습니다.');});}
function editCatalog(a,id){readCatalogDraft();if(a==='catalog-remove')catalogDraft.splice(+id,1);else{const n=$('#newCatalogName').value.trim();if(!n)throw Error('추가할 물품명을 입력하세요.');if(catalogDraft.map(x=>x.trim()).includes(n))throw Error('이미 목록에 있는 물품명입니다.');if(catalogDraft.length>=200)throw Error('최대 200개까지 등록할 수 있습니다.');catalogDraft.push(n);$('#newCatalogName').value='';}$('#catalogRows').innerHTML=catalogHTML();}
function eventModal(id='',kind='out'){requireManager();const opts=itemOptions();if(!opts.length)throw Error('물품을 먼저 등록하세요.');id=id||opts[0][0];openModal('입출고 등록',`<div class="form-summary" id="eventStock">현재 재고 <b>${fmt(itemBy(id)?.stock)} ${esc(itemBy(id)?.unit||'개')}</b></div><div class="form-grid">${selectField('구분 *','kind',[['in','입고'],['out','출고']],kind,'required')}${field('일자 *','eventDate',today(),'date',`required max="${today()}"`)}${selectField('물품 *','itemId',opts,id,'required')}${field('수량 *','quantity','','number','required min="1" max="1000000000" step="1"')}${field('부서','department','','text','maxlength="100"')}${field('수령인','recipient','','text','maxlength="80"')}${field('지급 목적 / 행사명','purpose','','text','maxlength="200"',true)}${area('메모','memo','','maxlength="1000"')}<label class="field full">증빙 PDF (선택 · 10MB 이하)<input type="file" name="file" accept=".pdf,application/pdf"><small>새 PDF는 무료 Firestore에 분할 저장합니다. 사용량 한도에 유의하세요. 개인정보·민감 문서를 첨부하지 마세요. 방문자에게 공개됩니다.</small></label></div><p class="minor-note">저장 시 Firestore 트랜잭션으로 최신 재고를 확인합니다. 개인정보 대신 내부 관리용 식별명을 사용하세요.</p>`,'입출고 저장',async fd=>{requireServer();const quantity=int(fd.get('quantity'),'수량',1),eventDate=validDate(fd.get('eventDate')),attachment=await uploadPDF(fd.get('file'));try{await mutate('event',{itemId:fd.get('itemId'),kind:fd.get('kind'),quantity,eventDate,department:fd.get('department').trim(),recipient:fd.get('recipient').trim(),purpose:fd.get('purpose').trim(),memo:fd.get('memo').trim(),...attachment});}catch(e){if(attachment.attachmentPath)e.message=(e.message||'저장 오류')+'\nPDF가 이미 업로드되었을 수 있습니다. 이력이 저장되었는지 먼저 확인하고, 연결되지 않은 파일만 Firestore inventoryFiles와 하위 chunks에서 정리하세요.';throw e;}toast('입출고를 저장했습니다.');});$('#modal [name=itemId]').addEventListener('change',e=>{const i=itemBy(e.target.value);$('#eventStock').innerHTML=`현재 재고 <b>${fmt(i?.stock)} ${esc(i?.unit||'개')}</b>`;});}
async function uploadPDF(file){
 if(!file?.size)return {attachmentPath:'',attachmentName:''};requireManager();requireServer();
 if(file.size>10485760||!/\.pdf$/i.test(file.name)||new TextDecoder().decode(await file.slice(0,5).arrayBuffer())!=='%PDF-')throw Error('10MB 이하의 올바른 PDF 파일을 선택하세요.');
 const signature=[file.name,file.size,file.lastModified].join('|');if(pdfCache?.signature===signature)return pdfCache.attachment;
 const bytes=new Uint8Array(await file.arrayBuffer()),fileId=uuid(),chunkSize=262144,chunkCount=Math.ceil(bytes.length/chunkSize),ref=F.doc(db,'inventoryFiles',fileId);
 const meta={name:file.name.slice(0,200),size:bytes.length,chunkCount,sha256:await sha256(bytes),state:'uploading',createdAt:F.serverTimestamp(),createdBy:S.user.uid};
 await F.setDoc(ref,meta);
 try{
  for(let first=0;first<chunkCount;first+=10){const batch=F.writeBatch(db);for(let index=first;index<Math.min(first+10,chunkCount);index++)batch.set(F.doc(db,'inventoryFiles',fileId,'chunks',String(index).padStart(4,'0')),{index,data:bytesBase64(bytes.subarray(index*chunkSize,Math.min((index+1)*chunkSize,bytes.length)))});await batch.commit();}
  await F.updateDoc(ref,{state:'ready'});
 }catch(e){e.message=(e.message||'PDF 업로드 실패')+'\n부분 업로드 파일 ID: '+fileId+' (연결되지 않은 파일은 Firestore inventoryFiles에서 하위 chunks와 함께 정리하세요.)';throw e;}
 const attachment={attachmentPath:'firestore:inventoryFiles/'+fileId,attachmentName:meta.name};pdfCache={signature,attachment};return attachment;
}

function reportModal(id=''){requireManager();const r=S.reports.find(x=>x.id===id),opts=itemOptions(true);if(!opts.length)throw Error('물품을 먼저 등록하세요.');openModal('소진결과보고 기록',`<div class="form-summary">재단 전자결재에서 처리한 <b>일자와 문서번호</b>를 남겨주세요.<br>현재 재고나 전자결재 상태를 변경하지 않습니다.</div><div class="form-grid">${selectField('물품 *','itemId',opts,r?.itemId||opts[0][0],'required',true)}${field('소진일','exhaustedDate',r?.exhaustedDate||'','date',`max="${today()}"`)}${field('소진결과보고일','reportDate',r?.reportDate||'','date',`max="${today()}"`)}${field('전자결재 문서번호','reportNumber',r?.reportNumber||'','text','maxlength="100"')}${selectField('기록 상태 *','status',[['미보고','미보고'],['보고 완료','보고 완료'],['확인 필요','확인 필요']],r?.status||'미보고','required')}${area('메모','memo',r?.memo||'','maxlength="1000"')}</div>`,'보고 기록 저장',async fd=>{const exhaustedDate=validDate(fd.get('exhaustedDate'),'소진일',false),reportDate=validDate(fd.get('reportDate'),'보고일',false),status=fd.get('status');if(status==='보고 완료'&&!reportDate)throw Error('보고일을 입력하세요.');if(exhaustedDate&&reportDate&&reportDate<exhaustedDate)throw Error('보고일은 소진일보다 빠를 수 없습니다.');await mutate('report',{id:r?.id||'',itemId:fd.get('itemId'),exhaustedDate,reportDate,reportNumber:fd.get('reportNumber').trim(),status,memo:fd.get('memo').trim(),expectedVersion:r?.version||0});toast('소진보고 기록을 저장했습니다.');});}
function eventDetail(id){const e=S.events.find(x=>x.id===id);if(!e)throw Error('기록을 찾을 수 없습니다.');const c=S.events.find(x=>x.id===e.cancellationId);openModal('입출고 기록 상세',`<div class="form-summary">${eventType(e)} <b>${esc(itemBy(e.itemId)?.name||e.itemName)}</b></div><dl class="manual-details"><dt>일자</dt><dd>${esc(e.eventDate)}</dd><dt>수량 변동</dt><dd>${e.delta>0?'+':''}${fmt(e.delta)} ${esc(e.unit||'개')} (재고 ${fmt(e.beforeStock)} → ${fmt(e.afterStock)})</dd><dt>부서 / 수령인</dt><dd>${esc(e.department||'-')} / ${esc(e.recipient||'-')}</dd><dt>목적</dt><dd>${esc(e.purpose||'-')}</dd><dt>메모</dt><dd>${esc(e.memo||'-')}</dd><dt>사유</dt><dd>${esc(e.reason||'-')}</dd><dt>등록시각</dt><dd>${esc(stamp(e.createdAt))}</dd>${e.cancelled?`<dt>취소 정보</dt><dd>${esc(stamp(e.cancelledAt))}\n${esc(c?.reason||'취소 보정 기록 참조')}</dd>`:''}${e.originalId?`<dt>원본 기록 ID</dt><dd>${esc(e.originalId)}</dd>`:''}</dl><div class="inline-actions">${e.attachmentPath?btn(icon('download')+'증빙 PDF','download-pdf','small',idAttr(id)):'<span class="minor-note">첨부 증빙 없음</span>'}${canManage()&&!e.cancelled&&e.kind!=='cancel'?btn('기록 취소','cancel-event','danger small',idAttr(id)):''}</div><p class="minor-note">공용 PIN은 개인을 식별하지 못합니다. 공용 관리자 계정 UID가 기록됩니다.</p>`,null,null);}
function cancelModal(id){requireManager();const e=S.events.find(x=>x.id===id);if(!e||e.cancelled||e.kind==='cancel')throw Error('취소할 수 없는 기록입니다.');openModal('입출고 기록 취소',`<div class="form-summary"><b>${esc(itemBy(e.itemId)?.name||e.itemName)}</b> · ${esc(e.eventDate)}<br>기존 변동 ${e.delta>0?'+':''}${fmt(e.delta)} → 반대 수량으로 보정합니다.</div>${area('취소 사유 *','reason','','required maxlength="500"')}<p class="minor-note">원본은 보존합니다. 취소하면 재고가 음수가 되는 입고 기록은 취소할 수 없습니다.</p>`,'취소 확정',async fd=>{const reason=fd.get('reason').trim();if(!reason)throw Error('취소 사유를 입력하세요.');await mutate('cancel',{id,reason});toast('취소 사유와 보정 이력을 저장했습니다.');});}
async function downloadPDF(id){
 const e=S.events.find(x=>x.id===id);if(!e?.attachmentPath)throw Error('첨부파일을 찾을 수 없습니다.');
 if(e.attachmentPath.startsWith('firestore:inventoryFiles/')){
  requireServer();const fileId=e.attachmentPath.split('/')[1];if(!/^[A-Za-z0-9_-]+$/.test(fileId))throw Error('첨부 경로가 올바르지 않습니다.');
  const snap=await F.getDoc(F.doc(db,'inventoryFiles',fileId));if(!snap.exists())throw Error('첨부파일을 찾을 수 없습니다.');const m=snap.data();
  if(m.state!=='ready'||!Number.isSafeInteger(m.size)||m.size<1||m.size>10485760||m.chunkCount!==Math.ceil(m.size/262144))throw Error('첨부파일 업로드가 완료되지 않았거나 정보가 올바르지 않습니다.');
  const chunks=await Promise.all(Array.from({length:m.chunkCount},(_,i)=>F.getDoc(F.doc(db,'inventoryFiles',fileId,'chunks',String(i).padStart(4,'0')))));
  const bytes=new Uint8Array(m.size);let offset=0;
  for(let i=0;i<chunks.length;i++){const s=chunks[i];if(!s.exists()||s.data().index!==i||typeof s.data().data!=='string')throw Error('첨부파일 조각이 누락되었습니다.');const raw=atob(s.data().data),expected=Math.min(262144,m.size-offset);if(raw.length!==expected)throw Error('첨부파일 크기가 일치하지 않습니다.');for(let j=0;j<raw.length;j++)bytes[offset+j]=raw.charCodeAt(j);offset+=raw.length;}
  if(await sha256(bytes)!==m.sha256)throw Error('첨부파일 무결성 검사에 실패했습니다.');
  downloadBlob(new Blob([bytes],{type:'application/pdf'}),e.attachmentName||m.name||'증빙자료.pdf');return;
 }
 // 이전 버전의 Storage PDF 링크도 유지합니다. 해당 버킷이 계속 운영 중이어야 합니다.
 if(!/^inventory\/[A-Za-z0-9_-]+\/[A-Za-z0-9_-]+[.]pdf$/.test(e.attachmentPath))throw Error('기존 첨부 경로를 확인하세요.');
 if(!storage){const sf=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js');Object.assign(F,sf);storage=F.getStorage(F.getApp());}
 downloadBlob(new Blob([await F.getBytes(F.ref(storage,e.attachmentPath),10485760)],{type:'application/pdf'}),e.attachmentName||'증빙자료.pdf');
}

function readEditor(){if(!editorDraft||!$('#editorSections'))return;document.querySelectorAll('[data-editor-index]').forEach(el=>{const s=editorDraft.sections[+el.dataset.editorIndex];s.title=el.querySelector('[data-edit-title]').value;s.body=el.querySelector('[data-edit-body]').value;s.style=el.querySelector('[data-edit-style]').value;});for(let i=0;i<2;i++){editorDraft.attachments[i].label=$(`[name=attachmentLabel${i}]`).value;editorDraft.attachments[i].url=$(`[name=attachmentURL${i}]`).value;}}

function manualEditModal(){requireManager();editorDraft={sections:clone(S.manual.sections),attachments:clone(S.manual.attachments)};editorRevision=S.manual.revision||0;openModal('업무 매뉴얼 수정',`<p class="minor-note" style="margin:0 0 18px">제목·본문·순서·양식 파일을 편집할 수 있습니다.</p><div id="editorSections">${editorHTML()}</div>${btn('＋ 내용 추가','manual-add','soft small')}<h3 style="margin:28px 0 13px">지급요청서 버튼</h3>${editorDraft.attachments.map((a,i)=>`<div class="edit-file-group"><div class="form-grid">${field(`붙임 ${i+1} 버튼 이름 *`,`attachmentLabel${i}`,a.label,'text','required maxlength="100"',true)}${field('연결 주소 (HTTPS 또는 같은 사이트 상대 경로)',`attachmentURL${i}`,a.url,'text','maxlength="1000"',true)}<label class="field full">교체 파일 (HWP/HWPX · 200KB 이하)<input type="file" name="attachmentFile${i}" accept=".hwp,.hwpx"><small id="attachmentState${i}">${a.data?'교체한 파일: '+esc(a.fileName):'HTML 포함 양식 사용'}</small></label></div><div class="inline-actions">${btn('기본 양식으로 복원','manual-reset-file','tiny',idAttr(i))}</div></div>`).join('')}`,'매뉴얼 저장',async()=>{readEditor();if(!editorDraft.sections.length)throw Error('매뉴얼 내용을 한 개 이상 입력하세요.');for(const s of editorDraft.sections){s.title=s.title.trim();s.body=s.body.trim();if(!s.title||!s.body)throw Error('모든 제목과 본문을 입력하세요.');}for(let i=0;i<2;i++){const a=editorDraft.attachments[i];a.label=a.label.trim();a.url=a.url.trim();if(!a.label)throw Error('붙임 버튼 이름을 입력하세요.');if(a.url)safeURL(a.url);const file=$(`[name=attachmentFile${i}]`).files[0];if(file){if(a.url)throw Error('교체 파일과 연결 주소 중 하나만 지정하세요.');if(!file.size||file.size>204800||!/\.(hwp|hwpx)$/i.test(file.name))throw Error('200KB 이하 HWP/HWPX 파일을 선택하세요.');const bytes=new Uint8Array(await file.arrayBuffer());a.data=btoa(Array.from(bytes,c=>String.fromCharCode(c)).join(''));a.fileName=file.name;}}await mutate('manual',{...editorDraft,expectedRevision:editorRevision});toast('업무 매뉴얼을 저장했습니다.');},true);}
function editSection(a,id){readEditor();const i=+id;if(a==='manual-add'){if(editorDraft.sections.length>=20)throw Error('최대 20개까지 등록할 수 있습니다.');editorDraft.sections.push({title:'새 안내',body:'',style:'normal'});}if(a==='manual-remove')editorDraft.sections.splice(i,1);if(a==='manual-up'&&i>0)[editorDraft.sections[i-1],editorDraft.sections[i]]=[editorDraft.sections[i],editorDraft.sections[i-1]];if(a==='manual-down'&&i<editorDraft.sections.length-1)[editorDraft.sections[i+1],editorDraft.sections[i]]=[editorDraft.sections[i],editorDraft.sections[i+1]];$('#editorSections').innerHTML=editorHTML();}
function setupBody(){return `<div class="setup"><div class="info-strip"><span><b>무료 Spark · 6자리 PIN 버전</b><br>Cloud Functions 배포·결제 계정·사용자 UID 입력이 필요 없습니다. 화면에서는 PIN만 입력하고, 내부적으로 Firebase 이메일/비밀번호 인증을 사용합니다. Firebase 콘솔 설정은 아래 순서대로 한 번 진행하세요.</span></div><h3>1. Authentication 사용 설정</h3><p>Firebase 콘솔 → 프로젝트 <b>k-medihub-gift-inventory</b> → Authentication → Sign-in method에서 <b>익명</b>과 <b>이메일/비밀번호</b>를 모두 켭니다. 이메일 링크 방식이 아닌 비밀번호 로그인을 사용합니다.</p><h3>2. PIN 전용 관리자 계정 만들기</h3><p>Authentication → Users → 사용자 추가에서 아래 계정을 만듭니다. 이미 같은 이메일이 있으면 해당 계정에 설정한 6자리 비밀번호를 PIN으로 사용하세요.</p><pre>이메일: admin@k-medihub.local
비밀번호: Firebase에 설정한 6자리 PIN</pre><p>팀원은 화면에서 설정한 <b>6자리 PIN</b>만 입력합니다. 이메일을 입력하는 화면은 없습니다. PIN을 HTML에서 단순 비교하지 않으며 Firebase Authentication이 실제 비밀번호를 검사합니다. 계정의 비밀번호 정책에서 숫자 6자리만 허용하지 않는 경우 정책을 조정하거나 더 강한 PIN 방식으로 바꿔야 합니다. 이 파일을 올리는 것만으로 계정이 자동 생성되거나 비밀번호가 변경되지는 않습니다.</p><h3>3. Firestore 규칙 게시</h3><p>Firestore Database → 규칙 탭에 아래 규칙을 게시합니다. 기존 <b>write: false</b> 규칙 대신 이 규칙을 사용하세요. 다른 앱도 같은 프로젝트를 쓴다면 기존 규칙과 병합하세요. Firestore (default) 데이터베이스를 사용합니다.</p><div class="inline-actions">${btn('규칙 복사','copy-firestore','primary small')}${btn('Firestore 규칙 다운로드','download-firestore','small')}</div><pre>${esc($('#firestoreRules').textContent.trim())}</pre><p>Firestore 규칙은 <b>PIN 자체를 읽거나 비교하지 않습니다.</b> 위 이메일 계정으로 비밀번호 인증된 요청만 쓰기를 허용합니다. 익명 방문자는 조회만 할 수 있습니다. 로그인·저장 코드에서 유료 Cloud Functions 호출은 제거했습니다.</p><h3>4. GitHub Pages에 업로드</h3><p>이 HTML을 저장소의 기존 <b>index.html</b>로 교체하고 Pages 배포 완료 후 강력 새로고침합니다. Authentication → Settings → 승인된 도메인에 <b>bae4902.github.io</b>를 추가하세요. file://로 열면 화면만 미리 볼 수 있으며 공동 저장은 HTTPS 사이트에서 사용합니다. 인터넷 연결과 Firebase CDN 로딩이 필요합니다.</p><h3>5. 동작 확인</h3><p>관리자 PIN 로그인 → 물품명 목록 저장 → 물품 등록 → 입출고 저장 → 다른 브라우저에서 재고 확인 순서로 점검하세요. 저장은 Firestore 트랜잭션을 사용해 최신 재고·음수 방지·수정 버전을 확인하고, 요청 ID로 동일 요청의 중복 반영을 방지합니다. 기존 단위·기록은 유지하며 데이터 구조가 다른 기존 물품은 자동 변환하지 않습니다.</p><h3>기본 양식 파일 확인</h3><p>HTML에 포함된 붙임 양식 데이터는 원본 그대로 보존했습니다. 파일이 내려받아지지 않는 경우 임의로 복원하거나 삭제하지 마세요. 업무 매뉴얼 → 매뉴얼 수정에서 원본 HWP/HWPX(200KB 이하)로 교체하거나 HTTPS 연결 주소를 지정해 주세요.</p><h3>PDF 증빙과 사용량</h3><p>새 PDF는 <b>10MB 이하</b>로, Firestore <b>inventoryFiles</b>의 메타데이터와 하위 <b>chunks</b> 문서에 분할 저장합니다. 새 PDF에는 Cloud Storage·Functions가 필요 없습니다. 10MB 파일 하나는 최대 40개 조각으로 저장되어 업로드·다운로드마다 무료 읽기/쓰기·저장공간·전송 한도를 사용합니다. 작은 파일 위주로 사용하고 콘솔에서 사용량을 확인하세요. 사용량 한도 내에서만 무료입니다. 저장에 연결되지 않은 PDF를 정리할 때는 inventoryFiles 문서와 하위 chunks를 함께 삭제하세요.</p><p>예전 Storage PDF 경로는 보존합니다. 다운로드하려면 해당 버킷이 계속 제공되고 읽기 규칙도 허용되어야 하며, 현재 요금제에서 기존 버킷을 사용할 수 있는지는 별도 확인이 필요합니다. 기존 PDF는 자동 이전하지 않습니다.</p><details><summary>기존 Storage PDF 읽기 규칙 (선택)</summary><pre>${esc($('#storageRules').textContent.trim())}</pre>${btn('Storage 읽기 규칙 다운로드','download-storage','small')}</details><h3 style="margin-top:22px">운영 참고</h3><p>한 시간 후 자동 로그아웃합니다. 공용 계정이라 팀원 개인을 구분하지 못합니다. 재고·이력·PDF는 익명 방문자도 조회 가능하므로 개인정보·민감 문서는 입력하지 마세요. 상세 입력 검증은 브라우저에서 수행하므로, 이를 서버에서 강제하는 구성은 아닙니다. 실서비스의 계정 생성·규칙 게시·데이터 저장은 운영자가 적용해야 하며 이 파일 생성 과정에서 운영 Firebase 데이터는 변경하지 않았습니다.</p></div>`;}

function adminModal(){if(canManage()){openModal('관리자 모드',`<div class="form-summary"><b>Firebase 인증으로 확인한 관리자 권한입니다.</b><br>자동 로그아웃: ${new Date(S.expires).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'})}</div><div class="inline-actions">${btn('관리자 로그아웃','lock-admin','primary')}${btn('무료 연결 도움말','setup')}</div>`,null,null);return;}
 openModal('관리자 로그인',`<div class="pin-intro"><div class="empty-symbol">${icon('lock')}</div><h3>6자리 관리자 PIN을 입력하세요</h3><p>PIN만 입력하면 됩니다. 이메일 입력은 필요하지 않습니다.</p></div><div class="pin-field-wrap"><label class="field">관리자 PIN (숫자 6자리)<input name="pin" class="pin-field" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="••••••" autocomplete="current-password" aria-describedby="pinNote" required></label></div><p id="pinNote" class="minor-note">Firebase에 설정한 6자리 PIN으로 로그인합니다. 최초 사용 전 아래 도움말의 계정 생성과 규칙 게시를 완료하세요.</p><div class="inline-actions">${btn('무료 연결 도움말','setup','small')}</div>`,'관리자 로그인',async fd=>{
  requireServer();const pin=String(fd.get('pin')||'');if(!/^[0-9]{6}$/.test(pin))throw Error('숫자 6자리 PIN을 입력하세요.');
  const credential=await F.signInWithEmailAndPassword(auth,ADMIN_EMAIL,pin);await syncClaims(credential.user);
  if(!canManage())throw Error('관리자 계정을 확인하지 못했습니다. 무료 연결 도움말을 확인하세요.');render();toast('관리자 모드가 열렸습니다.');
 });
}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했습니다.');}catch{openModal('내용 복사',`<textarea readonly aria-label="복사할 내용" style="min-height:320px">${esc(t)}</textarea>`,null,null,true);}}
async function syncClaims(user){
 if(!user)return;const uid=user.uid,result=await user.getIdTokenResult();if(auth.currentUser?.uid!==uid)return;
 S.user=user;S.admin=false;S.expires=0;clearTimeout(expiryTimer);
 const isAdmin=!user.isAnonymous&&result.claims.email===ADMIN_EMAIL&&result.claims.firebase?.sign_in_provider==='password';
 if(!isAdmin)return;
 let deadline;try{deadline=JSON.parse(sessionStorage.getItem(ADMIN_SESSION_KEY)||'null');}catch{}
 if(!deadline||deadline.uid!==uid){deadline={uid,until:Date.now()+3600000};try{sessionStorage.setItem(ADMIN_SESSION_KEY,JSON.stringify(deadline));}catch{}}
 if(!Number.isFinite(deadline.until)||deadline.until<=Date.now()){
  try{sessionStorage.removeItem(ADMIN_SESSION_KEY);}catch{}await F.signOut(auth);return;
 }
 S.expires=deadline.until;S.admin=true;
 expiryTimer=setTimeout(async()=>{
  S.admin=false;S.expires=0;try{sessionStorage.removeItem(ADMIN_SESSION_KEY);}catch{}
  if($('#modal').open&&!$('#submitModal')?.disabled)closeModal();render();
  try{await F.signOut(auth);}catch(e){S.error=errorText(e);render();}toast('관리자 시간이 만료되었습니다. 다시 로그인하세요.');
 },Math.max(1,Math.min(S.expires-Date.now(),2147483647)));
}

function stopData(){subscriptions.forEach(fn=>fn());subscriptions=[];S.items=[];S.events=[];S.reports=[];S.manual=clone(DEFAULT_MANUAL);S.loaded=false;S.loading=false;S.names=null;S.catalogRevision=0;S.catalogStatus='loading';}
function startData(epoch){S.loading=true;const pending=new Set(['items','events','reports','manual']),failed=new Set();const done=key=>{pending.delete(key);S.loading=pending.size>0;S.loaded=pending.size===0&&failed.size===0;if(!failed.size)S.error='';render();};for(const [key,name]of [['items','items'],['events','transactions'],['reports','exhaustionReports']])subscriptions.push(F.onSnapshot(F.collection(db,name),snap=>{if(epoch!==authEpoch)return;S[key]=snap.docs.map(d=>({...d.data(),id:d.id}));if(key==='items'){if(S.items.some(i=>!Number.isSafeInteger(i.stock)||!Number.isSafeInteger(i.revision)||!Number.isSafeInteger(i.version)||typeof i.name!=='string')){failed.add(key);S.error='기존 데이터 구조가 감지되었습니다. 배포 전 백업과 데이터 이전이 필요합니다.';done(key);return;}S.items.sort((a,b)=>a.name.localeCompare(b.name,'ko'));}failed.delete(key);done(key);},e=>{if(epoch!==authEpoch)return;failed.add(key);S.error=errorText(e);done(key);}));subscriptions.push(F.onSnapshot(F.doc(db,'settings','manual'),snap=>{if(epoch!==authEpoch)return;S.manual=snap.exists()?{...clone(DEFAULT_MANUAL),...snap.data()}:clone(DEFAULT_MANUAL);failed.delete('manual');done('manual');},e=>{if(epoch!==authEpoch)return;failed.add('manual');S.error=errorText(e);done('manual');}));subscriptions.push(F.onSnapshot(F.doc(db,'settings','itemNames'),snap=>{if(epoch!==authEpoch)return;if(snap.exists()){const d=snap.data();if(!Array.isArray(d.names)||!d.names.every(n=>typeof n==='string')){S.catalogStatus='unavailable';return;}S.names=d.names;S.catalogRevision=d.revision||0;}else{S.names=null;S.catalogRevision=0;}S.catalogStatus='ready';render();},e=>{if(epoch!==authEpoch)return;console.warn('물품명 목록 규칙 확인 필요',e.code);S.catalogStatus='unavailable';render();}));}
async function initFirebase(){if(location.protocol==='file:'){S.error='현재는 파일 미리보기입니다. Firebase 인증·공동 저장은 GitHub Pages 등 HTTPS 주소에 올린 후 사용하세요.';render();return;}try{const base='https://www.gstatic.com/firebasejs/11.10.0/',modules=await Promise.all(['app','auth','firestore'].map(n=>import(base+'firebase-'+n+'.js')));F=Object.assign({},...modules);const app=F.initializeApp(firebaseConfig);auth=F.getAuth(app);db=F.getFirestore(app);await F.setPersistence(auth,F.browserSessionPersistence);S.ready=true;F.onAuthStateChanged(auth,async user=>{const epoch=++authEpoch;stopData();S.user=user;S.admin=false;S.expires=0;clearTimeout(expiryTimer);try{if(!user){await F.signInAnonymously(auth);return;}await syncClaims(user);if(epoch!==authEpoch)return;startData(epoch);}catch(e){S.error=errorText(e);render();}});render();}catch(e){S.ready=false;S.error='Firebase 초기화 실패: '+errorText(e);render();}}
async function action(a,id){switch(a){case'admin':adminModal();break;case'close':closeModal();break;case'setup':setupModal();break;case'new-item':itemModal();break;case'edit-item':itemModal(id);break;case'manage-names':catalogModal();break;case'catalog-add':case'catalog-remove':editCatalog(a,id);break;case'new-event':eventModal();break;case'item-in':eventModal(id,'in');break;case'item-out':eventModal(id,'out');break;case'new-report':reportModal();break;case'edit-report':reportModal(id);break;case'event-detail':eventDetail(id);break;case'cancel-event':cancelModal(id);break;case'export':exportXLSX();break;case'stock-group':stockGroupModal(id);break;case'item-history':itemHistoryModal(id);break;case'item-history-page':showItemHistoryPage(id);break;case'attachment':downloadAttachment(+id);break;case'download-pdf':await downloadPDF(id);break;case'edit-manual':manualEditModal();break;case'manual-add':case'manual-up':case'manual-down':case'manual-remove':editSection(a,id);break;case'manual-reset-file':readEditor();editorDraft.attachments[+id]={...editorDraft.attachments[+id],url:'',fileName:'',data:''};$(`[name=attachmentURL${id}]`).value='';$(`[name=attachmentFile${id}]`).value='';$(`#attachmentState${id}`).textContent='HTML 포함 양식 사용';break;case'copy-firestore':await copyText($('#firestoreRules').textContent.trim());break;case'download-firestore':downloadBlob(new Blob([$('#firestoreRules').textContent.trim()+'\n'],{type:'text/plain;charset=utf-8'}),'firestore.rules');break;case'download-storage':downloadBlob(new Blob([$('#storageRules').textContent.trim()+'\n'],{type:'text/plain;charset=utf-8'}),'storage.rules');break;case'lock-admin':try{sessionStorage.removeItem(ADMIN_SESSION_KEY);}catch{}S.admin=false;S.expires=0;clearTimeout(expiryTimer);closeModal();if(auth)await F.signOut(auth);render();toast('관리자 모드를 종료했습니다.');break;case'reload':location.reload();break;}}
async function safeAction(a,id){if($('#submitModal')?.disabled)return;try{await action(a,id);}catch(e){if($('#modal').open)$('#formError').textContent=errorText(e);else toast(errorText(e));}}
$('#navigation').innerHTML=Object.entries(paths).map(([p,v])=>(p==='manual'?'<div class="nav-divider"></div>':'')+`<button type="button" class="nav" data-page="${p}">${icon(p)}${v[0]}</button>`).join('');
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){if(location.hash.slice(1)===nav.dataset.page)setPage(nav.dataset.page);else location.hash=nav.dataset.page;return;}const el=e.target.closest('[data-action]');if(el&&!el.disabled){safeAction(el.dataset.action,el.dataset.id);return;}const sf=e.target.closest('[data-stock-filter]');if(sf){S.stockFilter=sf.dataset.stockFilter;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const at=e.target.selectionStart;S.query=e.target.value;render();$('#search').focus();try{$('#search').setSelectionRange(at,at);}catch{}}});
document.addEventListener('change',e=>{if(['itemFilter','typeFilter','dateFrom','dateTo'].includes(e.target.id)){S[e.target.id]=e.target.value;render();}});
$('#modalForm').addEventListener('submit',async e=>{e.preventDefault();if(!modalSubmit)return;const b=$('#submitModal');if(b.disabled)return;const label=b.textContent,handler=modalSubmit;b.disabled=true;b.textContent='처리 중…';$('#formError').textContent='';try{await handler(new FormData($('#modalForm')));if(modalSubmit===handler){$('#modal').close();modalSubmit=null;}}catch(err){$('#formError').textContent=errorText(err);}finally{if(b.isConnected){b.disabled=false;b.textContent=label;}}});
$('#modal').addEventListener('keydown',e=>{if(e.target.id==='newCatalogName'&&e.key==='Enter'){e.preventDefault();safeAction('catalog-add');}});$('#modal').addEventListener('cancel',e=>{if($('#submitModal')?.disabled)e.preventDefault();});$('#closeModal').addEventListener('click',closeModal);$('#adminLogin').addEventListener('click',()=>safeAction('admin'));$('#mobileMenu').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');$('#mobileMenu').setAttribute('aria-expanded',String(open));});$('#sidebarScrim').addEventListener('click',()=>{document.body.classList.remove('menu-open');$('#mobileMenu').setAttribute('aria-expanded','false');});window.addEventListener('hashchange',()=>setPage(location.hash.slice(1)));window.addEventListener('offline',()=>toast('네트워크 연결이 끊겼습니다. 연결 후 저장해 주세요.'));$('#topDate').textContent=today().replaceAll('-','.');try{sessionStorage.removeItem('inventory-admin');}catch{}setPage(location.hash.slice(1)||'stock');initFirebase();

</script></body></html>
