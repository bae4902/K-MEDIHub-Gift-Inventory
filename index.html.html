function itemInfo(id,s=data){const ls=s.lots.filter(l=>l.itemId===id).map(l=>lotInfo(l.id,s));return{stock:ls.reduce((a,b)=>a+b.stock,0),inQty:ls.reduce((a,b)=>a+b.inQty,0),outQty:ls.reduce((a,b)=>a+b.outQty,0),ever:ls.some(l=>l.ever||l.inQty>0),lots:ls.length}}

function reportStatus(l){const z=lotInfo(l.id),r=reportFor(l.id);if(validReport(l))return ['보고 완료',''];if(r)return ['재검토 필요','warn'];if(z.ever&&z.stock===0)return ['보고 대기','warn'];return [z.ever?'사용 중':'입고 전','gray']}
function canWrite(action='entry'){if(bootError||busy)return false;if(mode==='local')return !!db;if(!session||cloudError)return false;return role==='admin'||(role==='editor'&&['entry','report'].includes(action))}

function reqWrite(action){if(!canWrite(action))throw new Error(mode==='cloud'?'해당 기능의 권한 또는 서버 연결 상태를 확인하세요.':'저장소를 사용할 수 없습니다.')}
function goodDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v+'T12:00:00'))&&new Date(v+'T12:00:00').getDate()===Number(v.slice(8))}

function validate(s){assert(s&&s.schema===VERSION,'지원하지 않는 데이터 형식입니다.');for(const key of ['items','lots','entries','reports','files','audit'])assert(Array.isArray(s[key]),key+' 목록이 잘못되었습니다.');assert(s.items.length<=1000&&s.lots.length<=3000&&s.entries.length<=20000&&s.reports.length<=5000,'이 단일 파일 버전의 관리 한도를 초과했습니다.');const allIds=new Set();for(const key of ['items','lots','entries','reports','files'])for(const x of s[key]){assert(x&&typeof x==='object'&&typeof x.id==='string'&&/^[a-zA-Z0-9-]{8,80}$/.test(x.id),'식별자가 올바르지 않습니다.');assert(!allIds.has(x.id),'중복 식별자가 있습니다.');allIds.add(x.id);for(const [k,v] of Object.entries(x))if(typeof v==='string'&&k!=='data')assert(v.length<(k==='signature'?2000000:500000),'문자열 길이가 과도합니다.');}
const codes=new Set();for(const i of s.items){assert(typeof i.name==='string'&&i.name.trim()&&i.name.length<=100,'품목명이 올바르지 않습니다.');assert(typeof i.code==='string'&&i.code.trim()&&i.code.length<=40,'품목 코드가 올바르지 않습니다.');const c=i.code.trim().toLowerCase();assert(!codes.has(c),'품목 코드가 중복됩니다.');codes.add(c);assert(typeof i.unit==='string'&&i.unit.length>0&&i.unit.length<=20,'단위를 확인하세요.');assert(Number.isSafeInteger(i.minThreshold)&&i.minThreshold>=0&&i.minThreshold<=100000000,'안전재고 수량이 올바르지 않습니다.');assert(typeof i.enabled==='boolean','품목 사용 상태가 올바르지 않습니다.');}
for(const l of s.lots){assert(item(l.itemId,s),'구매차수의 품목 연결이 없습니다.');assert(typeof l.label==='string'&&l.label.trim()&&l.label.length<=100,'구매차수명을 확인하세요.');assert(goodDate(l.contractDate),'구매계약일이 올바르지 않습니다.');assert(Number.isFinite(l.unitPrice)&&l.unitPrice>=0&&l.unitPrice<=10000000000,'단가를 확인하세요.');}
for(const e of s.entries){const l=lot(e.lotId,s);assert(l,'이력의 구매차수 연결이 없습니다.');assert(['in','out','adjust'].includes(e.type),'알 수 없는 거래 구분입니다.');assert(Number.isSafeInteger(e.quantity)&&Math.abs(e.quantity)<=100000000&&(e.type==='adjust'||e.quantity>0),'수량은 범위 내 정수여야 합니다.');assert(goodDate(e.date)&&e.date<=today()&&e.date>=l.contractDate,'거래일은 계약일 이후, 오늘 이하여야 합니다.');assert(typeof e.createdAt==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(e.createdAt)&&Number.isFinite(Date.parse(e.createdAt)),'이력 생성 시간이 잘못되었습니다.');assert(!e.canceledAt||(typeof e.cancelReason==='string'&&e.cancelReason.trim()),'취소 사유가 없습니다.');if(e.type==='adjust'){assert(typeof e.reason==='string'&&e.reason.trim()&&typeof e.approver==='string'&&e.approver.trim(),'실사 조정 사유와 확인자가 필요합니다.');assert(Number.isSafeInteger(e.bookBefore)&&e.bookBefore>=0&&Number.isSafeInteger(e.physicalCount)&&e.physicalCount>=0&&e.physicalCount-e.bookBefore===e.quantity,'실사 수량이 일치하지 않습니다.');}if(e.attachmentId)assert(s.files.some(f=>f.id===e.attachmentId),'증빙 파일이 누락되었습니다.');}
for(const l of s.lots){let q=0;for(const e of ordered(s.entries.filter(e=>e.lotId===l.id&&!e.canceledAt))){if(e.type==='adjust')assert(q===e.bookBefore,`${item(l.itemId,s).name} · ${l.label}: 이후 실사의 장부 기준이 바뀝니다. 해당 실사를 먼저 취소한 뒤 재확인하세요.`);q+=delta(e);assert(q>=0,`${item(l.itemId,s).name} · ${l.label}: ${e.date} 시점에 음수 재고가 됩니다. 이후 출고·조정을 먼저 확인하세요.`);assert(q<=100000000,'구매차수 재고 한도를 초과합니다.');}}
for(const r of s.reports){assert(lot(r.lotId,s),'보고서의 구매차수 연결이 없습니다.');assert(goodDate(r.reportDate)&&r.reportDate<=today()&&r.reportDate>=r.exhaustDate,'보고일은 소진일 이후, 오늘 이하여야 합니다.');assert(typeof r.documentNo==='string'&&r.documentNo.trim(),'보고 문서번호가 필요합니다.');assert(typeof r.signature==='string','보고 근거가 누락되었습니다.');if(r.attachmentId)assert(s.files.some(f=>f.id===r.attachmentId),'보고서 증빙이 없습니다.');}
let fileSize=0;for(const f of s.files){assert(typeof f.name==='string'&&f.name.length<=200&&typeof f.data==='string'&&/^data:application\/pdf;base64,JVBERi0/.test(f.data),'올바른 PDF 증빙이 아닙니다.');assert(Number.isInteger(f.size)&&f.size>0&&f.size<=MAX_FILE&&f.data.length<=Math.ceil(MAX_FILE/3)*4+100,'PDF 파일은 1MB 이하여야 합니다.');fileSize+=f.data.length;}assert(fileSize<=MAX_PDFS,'PDF 저장 총량(인코딩 기준 8MB)을 초과했습니다.');assert(new Blob([JSON.stringify(s)]).size<=MAX_DATA,'전체 데이터 크기가 12MB를 초과했습니다.');return s;}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('stockroom-ledger-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();resolve(r.result)};r.onerror=()=>reject(r.error)})}
function localRead(){return new Promise((resolve,reject)=>{const tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get('main');r.onsuccess=()=>resolve(r.result||{data:blank(),revision:0,updatedAt:''});r.onerror=()=>reject(r.error)})}
function localSave(next,expected){return new Promise((resolve,reject)=>{let conflict=false;const tx=db.transaction('kv','readwrite'),store=tx.objectStore('kv'),r=store.get('main');let record;r.onsuccess=()=>{const old=r.result||{revision:0};if(old.revision!==expected){conflict=true;tx.abort();return}record={data:next,revision:old.revision+1,updatedAt:now()};store.put(record,'main')};tx.oncomplete=()=>resolve(record);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(new Error(conflict?'CONFLICT: 다른 탭에서 변경했습니다. 최신 데이터를 확인한 뒤 다시 등록하세요.':'저장 실패: 브라우저 저장 공간 또는 권한을 확인하세요.'))})}
async function parseResponse(r){let j;try{j=await r.json()}catch{j={}}if(!r.ok)throw new Error(j.message||j.msg||j.error_description||j.error||`서버 응답 오류 (${r.status})`);return j}
function keepSession(s){session={...s,expires_at:Date.now()+(s.expires_in||3600)*1000};sessionStorage.setItem('stockroom-session-v1',JSON.stringify(session))}
async function token(){assert(session,'공유 모드 로그인이 필요합니다.');if(Date.now()>(session.expires_at||0)-60000){try{const r=await fetch(config.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});keepSession(await parseResponse(r))}catch(e){session=null;role=null;sessionStorage.removeItem('stockroom-session-v1');throw new Error('로그인이 만료되었습니다. 다시 로그인하세요.')}}return session.access_token}
async function api(path,options={}){const t=await token();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{return await parseResponse(await fetch(config.url+path,{...options,headers:{apikey:config.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(options.headers||{})},signal:controller.signal}))}finally{clearTimeout(timer)}}
async function cloudRead(){const rows=await api('/rest/v1/inv_state?id=eq.main&select=data,revision,updated_at');assert(rows.length===1,'공유 저장소에 접근할 수 없습니다. SQL 설치와 사용자 권한을 확인하세요.');const r=rows[0];validate(r.data);return{data:r.data,revision:Number(r.revision),updatedAt:r.updated_at}}

async function sync(force=false){if(busy||pollBusy||bootError||mode==='cloud'&&!session)return;pollBusy=true;try{if(mode==='local'){const r=await localRead();if(r.revision!==revision){validate(r.data);adopt(r);if($('#modal').open)toast('다른 탭에서 변경했습니다. 작성 중인 내용을 확인하고 창을 다시 여세요.');render()}}else{const v=await api('/rest/v1/inv_state?id=eq.main&select=revision');assert(v.length,'공유 권한을 확인하세요.');if(force||Number(v[0].revision)!==revision){adopt(await cloudRead());if($('#modal').open)toast('공유 데이터가 변경되었습니다. 창을 다시 열어 최신 수량을 확인하세요.')}cloudError='';render()}}catch(e){if(mode==='cloud'){cloudError=errorMsg(e);render()}else toast(errorMsg(e),true)}finally{pollBusy=false}}

function viewDashboard(){const active=data.items.filter(i=>i.enabled),low=active.filter(i=>{const z=itemInfo(i.id);return z.ever&&z.stock<=i.minThreshold}),pending=data.lots.filter(l=>{const z=lotInfo(l.id);return z.ever&&z.stock===0&&!validReport(l)}),month=data.entries.filter(e=>!e.canceledAt&&e.date.startsWith(today().slice(0,7))).length;return head('INVENTORY OVERVIEW','재고는 한눈에, 기록은 빠짐없이.','구매차수별 재고와 소진 현황을 연결해 관리합니다.',writeButton('entry','입출고 등록')+`<span class="date-tag">${today()}</span>`)+`<div class="metrics">${[[active.length,'사용 중인 품목','입고 전 품목 포함','box'],[low.length,'안전재고 이하','입고 이력이 있는 품목만','alert'],[pending.length,'소진보고 확인 필요','미작성 · 근거 변경 포함','report'],[month,'이번 달 등록 이력','취소 제외 · 조정 포함','history']].map(([n,t,d,i])=>`<div class="metric"><div class="label">${t}${icon(i)}</div><div class="value">${fmt(n)}<span>건</span></div><small>${d}</small></div>`).join('')}</div><div class="sectionhead"><h2>품목별 현재 재고 <span class="tiny">${active.length}개 품목</span></h2>${btn('nav','품목 관리','small','data-tab="items"','arrow')}</div>${active.length?`<div class="cards">${active.map(i=>{const z=itemInfo(i.id),low=z.ever&&z.stock<=i.minThreshold;return `<article class="item-card"><div class="item-top"><div><span class="tiny">${E(i.code)} · ${E(i.category||'미분류')}</span><h3>${E(i.name)}</h3></div>${pill(!z.ever?'입고 전':low?'안전재고 이하':'정상',!z.ever?'gray':low?'warn':'')}</div><div class="stock-number">${fmt(z.stock)}<span>${E(i.unit)}</span></div><div class="tiny">누적 입고 ${fmt(z.inQty)} · 지급 ${fmt(z.outQty)}</div><div class="track ${low?'low':''}"><i style="width:${z.ever?Math.max(2,Math.min(100,z.stock/Math.max(z.inQty,z.stock,1)*100)):0}%"></i></div><div class="tiny">알림 기준 ${fmt(i.minThreshold)}${E(i.unit)} 이하 · ${E(i.location||'보관 위치 미등록')}</div><div class="cardfoot"><span>구매 ${z.lots}차수</span>${btn('item-history','이력 보기','small flat',`data-id="${E(i.id)}"`,'arrow')}</div></article>`}).join('')}</div>`:`<div class="panel">${empty('첫 품목을 등록해 주세요.','초기 수량을 임의로 넣지 않습니다. 품목 등록 후 구매 const typeName=t=>({in:'입고',out:'지급·출고',adjust:'실사 조정'}[t]||t);

function filteredEntries(){const q=filters.search.trim().toLowerCase();return data.entries.filter(e=>{const l=lot(e.lotId),i=item(l.itemId);return(!filters.item||l.itemId===filters.item)&&(!filters.lot||e.lotId===filters.lot)&&(!filters.type||e.type===filters.type)&&(!filters.status||(filters.status==='canceled'?!!e.canceledAt:!e.canceledAt))&&(!filters.from||e.date>=filters.from)&&(!filters.to||e.date<=filters.to)&&(!q||[i.name,i.code,l.label,l.contractNo,e.department,e.recipient,e.event,e.memo,e.reason,e.cancelReason].join(' ').toLowerCase().includes(q))}).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt))}
function viewHistory(){const es=filteredEntries(),size=30,pages=Math.max(1,Math.ceil(es.length/size));filters.page=Math.min(filters.page,pages);return head('FULL ACTIVITY LOG','입출고 이력','품목 상태와 관계없이 모든 입고·지급·실사·취소 내역을 보존합니다.',btn('csv','CSV 내보내기','','','download')+writeButton('entry','입출고 등록'))+`<form class="filters" id="historyFilters"><label class="search">통합 검색<input name="search" value="${E(filters.search)}" placeholder="품목, 구매차수, 부서, 수령인, 사유"></label><label>품목<select name="item">${itemOptions(filters.item)}</select></label><label>구분<select name="type">${[['','전체 구분'],['in','입고'],['out','지급·출고'],['adjust','실사 조정']].map(([v,t])=>`<option value="${v}" ${v===filters.type?'selected':''}>${t}</option>`).join('')}</select></label><label>상태<select name="status">${[['','전체 (취소 포함)'],['valid','유효 이력'],['canceled','취소 이력']].map(([v,t])=>`<option value="${v}" ${v===filters.status?'selected':''}>${t}</option>`).join('')}</select></label><label>시작일<input type="date" name="from" value="${E(filters.from)}"></label><label>종료일<input type="date" name="to" value="${E(filters.to)}"></label><button class="btn primary" type="submit">검색</button>${btn('clear-filter','초기화')}</form>${filters.lot?`<div class="callout">구매차수 필터: <strong>${E(lot(filters.lot)?.label)}</strong> ${btn('clear-filter','필터 해제','small')}</div>`:''}<div class="panel">${historyTable(es.slice((filters.page-1)*size,filters.page*size))}<div class="pages"><span>검색 결과 ${fmt(es.length)}건 · 취소 기록은 재고에 미반영</span><div class="actions">${btn('page','이전','small',`data-page="${filters.page-1}" ${filters.page<=1?'disabled':''}`)}<span>${filters.page} / ${pages}</span>${btn('page','다음','small',`data-page="${filters.page+1}" ${filters.page>=pages?'disabled':''}`)}</div></div></div>`}

function viewItems(){return head('ITEM MASTER','품목 관리','품목 코드·단위·안전재고를 설정합니다. 비활성 품목도 과거 이력은 그대로 남습니다.',writeButton('item','새 품목 등록','admin'))+`<div class="panel">${data.items.length?`<div class="table-wrap"><table><thead><tr><th>코드 / 품목명</th><th>분류 / 위치</th><th class="num">현재 재고</th><th class="num">안전재고 기준</th><th>상태</th><th>관리</th></tr></thead><tbody>${data.items.map(i=>`<tr><td><strong>${E(i.name)}</strong><span class="sub">${E(i.code)} · 단위 ${E(i.unit)}</span></td><td>${E(i.category||'—')}<span class="sub">${E(i.location||'—')}</span></td><td class="num">${fmt(itemInfo(i.id).stock)} ${E(i.unit)}</td><td class="num">${fmt(i.minThreshold)} ${E(i.unit)} 이하</td><td>${pill(i.enabled?'사용 중':'비활성',i.enabled?'':'gray')}</td><td><div class="actions">${writeButton('item','수정','admin',`data-id="${E(i.id)}"`,'settings','small')}${btn('item-history','이력','small',`data-id="${E(i.id)}"`)}</div></td></tr>`).join('')}</tbody></table></div>`:empty('관리할 품목을 추가해 주세요.','품목 등록에는 재고가 포함되지 않습니다. 수량은 입고·지급·실사 이력으로만 변경됩니다.',writeButton('item','품목 등록','admin'))}</div>`}
function viewSettings(){return head('STORAGE & COLLABORATION','저장·공유 설정','GitHub Pages는 화면을 배포하고, 공유 데이터는 별도의 데이터베이스에 저장합니다.')+`<div class="two-col"><section class="panel"><div class="panel-title"><h2>01 / 현재 저장 방식</h2>${pill(mode==='local'?'브라우저 단독 사용':'Supabase 공유 저장')}</div><div class="panel-body"><dl class="kv"><dt>데이터 위치</dt><dd>${mode==='local'?'이 브라우저의 IndexedDB':'Supabase PostgreSQL'}</dd><dt>사용 권한</dt><dd>${mode==='local'?'로컬 전체 편집 · 인증 없음':E({admin:'관리자',editor:'등록자',viewer:'조회자'}[role]||'로그인 필요')}</dd><dt>마지막 저장</dt><dd>${E(savedAt?dateTime(savedAt):'아직 없음')}</dd><dt>PDF 증빙</dt><dd>${data.files.length}개 · ${fmt(Math.ceil(data.files.reduce((n,f)=>n+f.data.length,0)/1024))}KB / 8,192KB</dd><dt>데이터 크기</dt><dd>${fmt(Math.ceil(new Blob([JSON.stringify(data)]).size/1024))}KB / 12,288KB</dd></dl><div class="callout warn">브라우저 저장은 기기·브라우저·사이트 주소별로 분리됩니다. 데이터 삭제나 시크릿 모드 종료 시 사라질 수 있어 <strong>영구 보관을 보장하지 않습니다.</strong> 운영용 공동 저장은 서버 연결과 별도 백업이 필요합니다.</div><div class="actions">${btn('backup','전체 JSON 백업','','','download')}${btn('restore','백업 복원','',mode!=='local'||!canWrite('admin')?'disabled':'','upload')}${mode==='cloud'?btn('local-mode','브라우저 모드로 전환'):''}${btn('refresh','새로고침','','','refresh')}</div><p class="tiny">백업에는 PDF와 변경 기록이 포함됩니다. 로그인 비밀번호·토큰·연결키는 포함하지 않습니다. 공유 모드의 덮어쓰기 복원은 차단합니다.</p></div></section><section class="panel"><div class="panel-title"><h2>02 / 공유 서버 연결</h2>${icon('cloud')}</div><div class="panel-body"><form id="configForm" class="form-grid"><div class="field full"><label for="projectUrl">Supabase Project URL</label><input id="projectUrl" name="url" type="url" required placeholder="https://프로젝트.supabase.co" value="${E(config.url||'')}" maxlength="200"></div><div class="field full"><label for="publicKey">Publishable key 또는 anon key</label><textarea id="publicKey" name="key" required maxlength="3000" placeholder="sb_publishable_… 또는 anon JWT">${E(config.key||'')}</textarea><small>이 키는 공개용입니다. secret / service_role 키는 절대 입력하지 마세요.</small></div><div class="field full"><div class="actions"><button class="btn" type="submit">연결 정보 저장</button>${btn('login',mode==='cloud'&&session?'다른 계정으로 로그인':'공유 모드 로그인','primary')}</div></div></form><div class="callout">서버 연결만으로 기존 브라우저 데이터가 업로드되지는 않습니다. 최초 운영은 공유 모드에서 시작하세요. 기존 데이터 이관이 필요하면 백업을 보존하고 관리자 검토 후 별도 진행하세요.</div><p class="tiny">로그인 후 등록된 권한에 따라 공통 데이터를 조회합니다. 20초 주기 자동 갱신 및 저장 시 리비전 검증으로 동시 덮어쓰기를 방지합니다.</p>${btn('nav','서버 설치 SQL · 권한 안내','small','data-tab="guide"','arrow')}</div></section></div><section class="panel"><div class="panel-title"><h2>최근 변경 로그</h2><span class="tiny">전체 로그는 백업 JSON 포함 · 공유 서버에도 별도 기록</span></div><div class="panel-body">${data.audit.length?data.audit.slice(-12).reverse().map(a=>`<div class="audit-row"><strong>${E(a.summary)}</strong><span class="sub">${E(dateTime(a.at))} · ${E(a.actor)} · ${E(a.action)}</span></div>`).join(''):'<p class="tiny">아직 변경 기록이 없습니다.</p>'}</div></section>`}
function viewGuide(){return head('OPERATING GUIDE','업무·배포 안내','처음 사용하는 담당자와 GitHub Pages 배포자를 위한 설정 안내입니다.')+`<div class="two-col"><section class="panel"><div class="panel-title"><h2>일상 업무 흐름</h2>${icon('book')}</div><div class="panel-body"><div class="steps"><div class="step"><strong>품목 등록</strong><p>품목 코드·이름·단위·보관 위치·안전재고를 등록합니다. 재고는 아직 0이며 ‘입고 전’으로 표시합니다.</p></div><div class="step"><strong>구매차수와 최초 입고 등록</strong><p>입출고 등록 → 입고 → 새 구매차수. 계약일·계약번호·구매처·단가·입고 수량을 입력합니다. 추가 입고는 같은 차수를 선택합니다.</p></div><div class="step"><strong>차수를 지정해 지급</strong><p>품목과 구매차수를 선택하고 부서·수령인·행사·지급 사유를 남깁니다. 여러 차수에서 지급하면 차수별로 나누어 등록합니다. 자동 FIFO 배분은 하지 않습니다.</p></div><div class="step"><strong>실사·조정</strong><p>차수별 실물 수량을 입력합니다. 차이 수량과 사유·확인자가 남습니다. 0개 차이도 기록할 수 있고, 조정으로 찾은 재고 역시 같은 차수에 연결됩니다.</p></div><div class="step"><strong>소진보고</strong><p>잔여 0이 된 차수를 자동 표시합니다. 보고 문서번호·보고일·PDF를 등록합니다. 근거 변경 시 기존 보고를 보존하고 새 버전 보고가 필요함을 표시합니다.</p></div></div><details><summary>잘못 등록한 기록을 수정하려면?</summary><p>수량·거래일·품목을 직접 수정하지 않습니다. 상세 → ‘기록 취소’에 사유를 입력한 뒤 올바르게 재등록합니다. 취소 기록도 삭제되지 않습니다. 음수 재고가 되거나 기존 실사의 장부 기준을 바꾸는 과거 기록 변경은 차단합니다. 해당 실사를 먼저 취소하고 과거 기록을 바로잡은 뒤 실사를 재등록하세요. 소진보고에는 모든 유효 이력이 연결됩니다.</p></details><details><summary>재고 단위와 사용 규정</summary><p>수량은 정수로 관리하며 품목별 기본 단위만 사용합니다. 이력이 있는 품목의 단위는 변경할 수 없습니다. ‘1인당 2종 이상 지급 불가’ 등 기관 규정은 신원·행사별 확정 기준이 없어 자동 강제하지 않습니다. 등록자가 내부 규정을 별도로 확인하세요.</p></details><details><summary>PDF 증빙·백업 보안</summary><p>PDF 확장자와 파일 헤더를 검사합니다. 파일당 1MB, 인코딩 합계 8MB, 전체 데이터 12MB 한도입니다. 증빙은 브라우저 모드에서는 IndexedDB, 공유 모드에서는 접근 제어된 DB JSON에 함께 저장합니다. 백업에도 원본 파일이 포함됩니다.</p><p>백신·악성코드 검사는 제공하지 않습니다. 신뢰할 수 있는 PDF만 등록하고, 내려받기 전 보안 검사를 하세요. 이름·수령인 등 개인정보가 포함된 백업은 안전한 사내 위치에 보관하세요.</p></details></div></section><section class="panel"><div class="panel-title"><h2>GitHub Pages 배포</h2>${icon('cloud')}</div><div class="panel-body"><div class="steps"><div class="step"><strong>HTML 업로드</strong><p>저장소에 이 파일을 업로드합니다. 사이트 첫 화면으로 쓰려면 GitHub에서 파일명을 <code>index.html</code>로 바꿉니다. 현재 이름을 유지하면 Pages 주소 뒤에 이 파일명을 붙여 접속합니다.</p></div><div class="step"><strong>Pages 활성화</strong><p>저장소 Settings → Pages → Deploy from a branch → main / root를 선택해 저장합니다. 표시되는 배포 URL을 사용하세요. GitHub 저장소 파일 보기 주소는 웹앱 주소가 아닙니다.</p></div><div class="step"><strong>단독 사용 또는 서버 설치</strong><p>브라우저 단독 사용은 별도 설치 없이 가능합니다. 공동 운영 시 Supabase 프로젝트를 만들고 아래 SQL을 SQL Editor에서 실행합니다. 외부 라이브러리·빌드 과정은 필요하지 않습니다.</p></div><div class="step"><strong>계정과 권한 등록</strong><p>Supabase Authentication → Users에서 사용자를 생성·초대하고 이메일 확인·비밀번호 설정을 완료합니다. 관리자 이메일을 아래 SQL 마지막 줄에 넣어 권한을 부여합니다. HTML 자체 회원가입은 제공하지 않습니다.</p></div><div class="step"><strong>서버 정보 입력 후 로그인</strong><p>저장·공유 설정에서 Project URL과 공개 Publishable/anon key를 입력합니다. 로그인 후 화면에 ‘공유 DB 연결’이 표시되는지 확인합니다. 다른 사용자도 동일한 연결 정보로 접속해야 합니다. 배포자가 아래 ‘공유 연결 기본값’ 안내대로 값을 넣으면 사용자별 입력을 생략할 수 있습니다.</p></div></div><div class="callout warn"><strong>공유 전 필수 확인</strong><br>① 미로그인 상태에서 DB 접근 불가 ② viewer 수정 불가 ③ 별도 계정에서 같은 재고 조회 ④ 두 창 동시 등록 시 충돌 차단 ⑤ JSON 백업·PDF 다운로드 정상 여부. service_role/secret 키·비밀번호·백업 파일은 GitHub에 올리지 마세요.</div></div></section></div><section class="panel"><div class="panel-title"><h2>Supabase 초기 설치 SQL</h2>${btn('copy-sql','SQL 복사','small','','report')}</div><div class="panel-body"><p class="tiny">새 프로젝트 기준 · 한 개의 공통 작업공간 · SQL은 신뢰할 수 있는 관리자만 실행하세요. 기존 데이터가 있는 프로젝트는 먼저 백업하고 동일 이름 테이블 충돌 여부를 검토하세요.</p><details><summary>설치 SQL 보기 (DB 권한·서버 검증·동시 저장 제어 포함)</summary><pre id="sqlText">${E(INSTALL_SQL)}</pre></details><details><summary>다른 사용자 추가·권한 변경 SQL</summary><pre>${E(MEMBER_SQL)}</pre><p>admin: 전체 관리 / editor: 입고·지급·소진보고 / viewer: 조회·백업. 실사·품목 변경·취소는 admin만 가능합니다. 이메일과 역할을 바꾸고 SQL Editor에서 실행하세요. 사용자 제거는 해당 inv_members 행을 삭제합니다. 로그인만으로 권한이 생기지 않습니다.</p></details><details><summary>공유 연결 기본값을 배포 파일에 넣으려면?</summary><p>텍스트 편집기로 이 HTML을 열어 스크립트 시작 부분의 <code>DEPLOY_CONFIG</code>에서 <code>url</code>과 <code>key</code>를 채우세요. URL은 Project URL, 키는 공개 Publishable/anon key만 사용합니다. 기존 로컬 설정이 없는 방문자는 자동으로 공유 로그인 화면을 보게 됩니다. 비밀번호·토큰·secret·service_role 키는 절대 넣지 마세요. 저장 후 GitHub에 다시 업로드합니다.</p></details><details><summary>운영 범위와 한계</summary><p>공유 DB는 한 작업공간의 스냅샷을 원자적으로 저장하는 소규모 팀용 구조입니다. 모든 요청에 전체 데이터가 오가므로 큰 증빙·대규모 동시 작업에는 적합하지 않습니다. 최대 품목 1,000개, 차수 3,000건, 거래 20,000건, 보고 버전 5,000건입니다. 초과 운영은 관계형 테이블·전용 파일 저장소를 갖춘 서버로 이전하세요.</p><p>서버는 역할·음수 재고·참조 무결성·기존 거래 불변·보고 버전 추가를 검증합니다. 공유 DB의 inv_audit는 인증 사용자·시각·리비전을 서버에서 별도로 남깁니다. SQL 관리자 권한 보유자는 DB를 직접 수정할 수 있습니다. 로컬 모드의 로그는 보안 감사 수단이 아닙니다.</p><p>Supabase 요금·데이터 보관·휴면 정책·백업 제공 여부는 사용 중인 플랜에서 확인하세요. 외부 서비스 장애·탈퇴·데이터 삭제에 대비해 별도 주기 백업이 필요합니다. 이 HTML은 서버를 자동 생성하거나 영구 보관을 보장하지 않습니다.</p><p>현재 원본 HTML은 첨부되지 않아 대화에 제시된 요구사항을 기준으로 새로 구성했습니다. 기존 사이트 데이터 자동 이전 및 원문 매뉴얼 복제는 포함하지 않습니다.</p></details></div></section>`}
function field(label,name,type='text',value='',extra='',full=false,help=''){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${E(value)}" ${extra}>${help?`<small>${help}</small>`:''}</div>`}
function selectField(label,name,options,full=false){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}" required>${options}</select></div>`}
function textField(label,name,value='',full=true){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" maxlength="1000">${E(value)}</textarea></div>`}
const footer=(label='저장')=>`<div class="form-footer">${btn('close','취소')}<button type="submit" class="btn primary">${label}</button></div>`;
function showModal(title,html,extra={}){lastFocus=document.activeElement;modalRevision=revision;modalExtra=extra;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal();setTimeout(()=>$('#modalBody input:not([readonly]),#modalBody select,#modalBody button')?.focus(),50)}
function closeModal(){if(busy)return;$('#modal').close();$('#modalBody').innerHTML='';lastFocus?.focus?.()}
function formError(e){let x=$('#formError');if(!x){x=document.createElement('div');x.id='formError';x.className='error-text';x.setAttribute('role','alert');$('#modalBody').prepend(x)}x.textContent=errorMsg(e);x.scrollIntoView({block:'nearest'});toast(errorMsg(e),true)}
function showItem(id){reqWrite('admin');const i=id?item(id):{code:'',name:'',unit:'개',category:'',location:'',minThreshold:0,enabled:true};assert(i,'품목이 없습니다.');const fixed=id&&data.lots.some(l=>l.itemId===id);showModal(id?'품목 수정':'새 품목 등록',`<form id="itemForm"><p class="form-note">재고 수량은 입출고 이력으로만 변경됩니다. 안전재고는 ‘이하’ 기준입니다.</p><div class="form-grid">${field('품목 코드 *','code','text',i.code,'required maxlength="40"')}${field('품목명 *','name','text',i.name,'required maxlength="100"')}${field('단위 *','unit','text',i.unit,`required maxlength="20" ${fixed?'readonly':''}`,false,fixed?'구매차수가 있는 품목은 단위를 바꿀 수 없습니다.':'개, 세트, 박스 등 하나의 기준 단위')}${field('안전재고 *','minThreshold','number',i.minThreshold,'required min="0" max="100000000" step="1"')}${field('분류','category','text',i.category,'maxlength="50"')}${field('보관 위치','location','text',i.location,'maxlength="100"')}<div class="field full"><label class="inline-check"><input type="checkbox" name="enabled" ${i.enabled?'checked':''}> 신규 입출고에 사용 (잔여 재고가 있으면 비활성화 불가)</label></div></div>${footer()}</form>`,{id})}
function showEntry(type='out'){reqWrite('entry');if(!data.items.some(i=>i.enabled)){showModal('먼저 품목을 등록해 주세요.',empty('사용 중인 품목이 없습니다.','품목 관리에서 품목을 추가한 후 입고를 등록하세요.',btn('close','닫기')));return}showModal('입출고 등록',`<form id="entryForm"><p class="form-note">확정 기록은 직접 수정하지 않습니다. 잘못된 기록은 사유를 남겨 취소 후 재등록합니다.</p><div class="form-grid">${selectField('거래 구분 *','type',`<option value="in" ${type==='in'?'selected':''}>입고</option><option value="out" ${type==='out'?'selected':''}>지급·출고</option>`)}${field('거래일 *','date','date',today(),`required max="${today()}"`)}${selectField('품목 *','itemId','<option value="">품목 선택</option>'+data.items.filter(i=>i.enabled).map(i=>`<option value="${E(i.id)}">${E(i.name)} (${E(i.unit)})</option>`).join(''))}${selectField('구매차수 *','lotId','<option value="">품목을 먼저 선택하세요</option>')}<div class="field full" id="lotHelp"><small>지급은 구매차수를 직접 지정합니다.</small></div><div class="field full" id="newLotFields" hidden></div>${field('수량 *','quantity','number','','required min="1" max="100000000" step="1"')}${field('부서 *','department','text','','required maxlength="100"')}${field('수령인 (입고 시 담당자)','recipient','text','','maxlength="100"')}${field('행사명 / 지급 목적','event','text','','maxlength="150"')}${textField('메모 / 지급 사유','memo')}${field('PDF 증빙 (선택, 1MB 이하)','pdf','file','','accept="application/pdf,.pdf"',true,'PDF는 재접속 후에도 보존되며 JSON 백업에 포함됩니다.')}</div>${footer('등록')}</form>`);refreshEntryLots()}
function refreshEntryLots(){const f=$('#entryForm');if(!f)return;const id=f.elements.itemId.value,type=f.elements.type.value,old=f.elements.lotId.value;const ls=data.lots.filter(l=>l.itemId===id&&(type==='in'||lotInfo(l.id).stock>0));f.elements.lotId.innerHTML='<option value="">구매차수 선택</option>'+ls.map(l=>`<option value="${E(l.id)}">${E(l.label)} · 잔여 ${fmt(lotInfo(l.id).stock)}</option>`).join('')+(type==='in'&&id?'<option value="new">+ 새 구매차수 생성</option>':'');if(old&&[...f.elements.lotId.options].some(o=>o.value===old))f.elements.lotId.value=old;else if(type==='in'&&id&&!ls.length)f.elements.lotId.value='new';else if(ls.length===1)f.elements.lotId.value=ls[0].id;updateNewLot()}
function updateNewLot(){const f=$('#entryForm');if(!f)return;const selected=f.elements.lotId.value,isNew=selected==='new',section=$('#newLotFields');if(isNew&&!section.innerHTML)section.innerHTML=`<div class="form-grid" style="padding:16px;border:1px solid var(--line);border-radius:9px;background:#f7faf8">${field('구매차수명 *','label','text','','required maxlength="100"',true)}${field('구매계약일 *','contractDate','date',today(),`required max="${today()}"`)}${field('계약 / 품의 문서번호','contractNo','text','','maxlength="100"')}${field('구매처','supplier','text','','maxlength="100"')}${field('단가 (원)','unitPrice','number',0,'required min="0" max="10000000000" step="0.01"')}</div>`;section.hidden=!isNew;$$('input',section).forEach(x=>x.disabled=!isNew);const l=lot(selected),z=l?lotInfo(l.id):null;$('#lotHelp').innerHTML=`<small>${l?`현재 장부재고 <strong>${fmt(z.stock)}${E(item(l.itemId).unit)}</strong> · 계약일 ${E(l.contractDate)} · 계약번호 ${E(l.contractNo||'미등록')}`:isNew?'새 차수 생성과 최초 입고는 한 번에 저장됩니다.':'잔여 재고가 있는 차수만 지급할 수 있습니다.'}</small>`}
async function readPDF(file,s){if(!file||!file.size)return null;assert(file.size<=MAX_FILE,'PDF 파일은 1MB 이하여야 합니다.');assert(/\.pdf$/i.test(file.name),'PDF 확장자 파일만 등록할 수 있습니다.');const prefix=new Uint8Array(await file.slice(0,5).arrayBuffer());assert(String.fromCharCode(...prefix)==='%PDF-','올바른 PDF 헤더가 아닙니다.');const result=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)});const encoded='data:application/pdf;base64,'+String(result).split(',')[1];const f={id:uid(),name:file.name,size:file.size,data:encoded,createdAt:now()};s.files.push(f);return f.id}

function csv(){const rows=[['거래일','구분','품목코드','품목','구매차수','계약일','계약번호','수량(재고증감)','단위','부서','수령인','행사','사유','메모','상태','취소사유','등록자','등록시각']];for(const e of filteredEntries()){const l=lot(e.lotId),i=item(l.itemId);rows.push([e.date,typeName(e.type),i.code,i.name,l.label,l.contractDate,l.contractNo,delta(e),i.unit,e.department,e.recipient,e.event,e.reason,e.memo,e.canceledAt?'취소':'유효',e.cancelReason,e.actor,e.createdAt])}const cell=v=>'"'+String(typeof v==='number'?v:/^[=+\-@\t\r\n]/.test(String(v??''))?"'"+v:v??'').replace(/"/g,'""')+'"';download(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`입출고이력_${today()}.csv`)}
async function prepareRestore(file){assert(mode==='local','공유 모드에서는 덮어쓰기 복원을 지원하지 않습니다.');assert(file&&file.size<=MAX_DATA*1.5,'백업 파일 크기를 확인하세요.');const b=JSON.parse(await file.text());assert(b.format==='stockroom-backup'&&b.version===1,'이 앱의 백업 파일이 아닙니다.');validate(b.data);showModal('백업 데이터 복원',`<form id="restoreForm"><p class="form-note">현재 브라우저 데이터를 백업본으로 <strong>교체</strong>합니다. 다른 기기나 공유 DB에는 영향을 주지 않습니다. 현재 데이터도 먼저 백업해 주세요.</p><dl class="kv"><dt>백업 시각</dt><dd>${E(dateTime(b.exportedAt))}</dd><dt>복원 내용</dt><dd>품목 ${b.data.items.length} · 차수 ${b.data.lots.length} · 이력 ${b.data.entries.length} · PDF ${b.data.files.length}</dd></dl><div class="field" style="margin-top:18px"><label for="f_confirm">계속하려면 ‘복원’을 입력하세요.</label><input id="f_confirm" name="confirm" required pattern="복원" autocomplete="off"></div>${footer('백업본으로 교체')}</form>`,{restoreData:b.data})}

const f=new FormData(form),get=k=>String(f.get(k)||'').trim();if(form.id==='itemForm'){const id=modalExtra.id;await commit('item',id?'품목 정보 변경':'품목 등록',s=>{const prev=id?item(id,s):null;const next={...(prev||{id:uid(),createdAt:now()}),code:get('code'),name:get('name'),unit:get('unit'),minThreshold:Number(get('minThreshold')),category:get('category'),location:get('location'),enabled:f.get('enabled')==='on'};if(prev){assert(!s.lots.some(l=>l.itemId===id)||next.unit===prev.unit,'이력이 있는 품목의 단위를 바꿀 수 없습니다.');assert(next.enabled||itemInfo(id,s).stock===0,'잔여 재고가 있는 품목은 비활성화할 수 없습니다.');Object.assign(prev,next)}else s.items.push(next)})}
else if(form.id==='entryForm'){const id=get('itemId'),t=get('type'),selected=get('lotId'),quantity=Number(get('quantity'));assert(item(id)?.enabled,'사용 중인 품목을 선택하세요.');assert(t==='in'||t==='out','구분을 확인하세요.');assert(quantity>0&&Number.isSafeInteger(quantity),'수량은 1 이상의 정수로 입력하세요.');await commit('entry',`${typeName(t)} 등록 · ${item(id).name} ${fmt(quantity)}`,async s=>{let l;if(selected==='new'){assert(t==='in','새 구매차수는 입고에서만 생성합니다.');l={id:uid(),itemId:id,label:get('label'),contractDate:get('contractDate'),contractNo:get('contractNo'),supplier:get('supplier'),unitPrice:Number(get('unitPrice')),createdAt:now()};s.lots.push(l)}else{l=lot(selected,s);assert(l&&l.itemId===id,'올바른 구매차수를 선택하세요.')}assert(get('date')>=l.contractDate,'거래일은 구매계약일 이후여야 합니다.');const attachmentId=await readPDF(f.get('pdf'),s);s.entries.push({id:uid(),lotId:l.id,type:t,date:get('date'),quantity,department:get('department'),recipient:get('recipient'),event:get('event'),memo:get('memo'),actor:actor(),createdAt:now(),attachmentId})})}
else if(form.id==='adjustForm'){const id=get('lotId'),book=Number(get('book')),physical=Number(get('physicalCount'));assert(Number.isSafeInteger(physical)&&physical>=0,'실재고는 0 이상의 정수입니다.');assert(get('reason')&&get('approver')&&get('memo'),'사유·확인자·상세 사유를 입력하세요.');assert((physical===book)===(get('reason')==='정기 실사 (차이 없음)'),'차이가 없으면 ‘정기 실사 (차이 없음)’, 차이가 있으면 실제 조정 사유를 선택하세요.');await commit('adjust','재고 실사·조정 등록',async s=>{assert(lotInfo(id,s).stock===book,'장부 수량이 변경되었습니다. 실사를 다시 확인하세요.');s.entries.push({id:uid(),lotId:id,type:'adjust',date:today(),quantity:physical-book,bookBefore:book,physicalCount:physical,reason:get('reason'),approver:get('approver'),memo:get('memo'),actor:actor(),createdAt:now(),attachmentId:await readPDF(f.get('pdf'),s)})})}
else if(form.id==='cancelForm'){const id=modalExtra.id,reason=get('cancelReason');assert(reason,'취소 사유를 입력하세요.');await commit('cancel','입출고·조정 기록 취소',s=>{const e=s.entries.find(x=>x.id===id);assert(e&&!e.canceledAt,'취소할 유효 기록이 없습니다.');Object.assign(e,{canceledAt:now(),cancelReason:reason,canceledBy:actor()})})}
else if(form.id==='reportForm'){const id=modalExtra.id;await commit('report','소진결과보고 버전 등록',async s=>{const l=lot(id,s),z=lotInfo(id,s);assert(z.stock===0&&z.ever,'소진 상태가 변경되었습니다.');s.reports.push({id:uid(),lotId:id,documentNo:get('documentNo'),reportDate:get('reportDate'),memo:get('memo'),contractDate:l.contractDate,contractNo:l.contractNo,label:l.label,itemName:item(l.itemId,s).name,inQty:z.inQty,outQty:z.outQty,adjust:z.adjust,exhaustDate:z.exhaustDate,signature:z.signature,createdAt:now(),actor:actor(),attachmentId:await readPDF(f.get('pdf'),s)})})}
else if(form.id==='restoreForm'){assert(get('confirm')==='복원','‘복원’을 정확히 입력하세요.');const restored=clone(modalExtra.restoreData);await commit('restore','JSON 백업본 복원',s=>{for(const k of Object.keys(s))delete s[k];Object.assign(s,restored)})}
}catch(e){if($('#modal').open)formError(e);else toast(errorMsg(e),true)}}

const INSTALL_SQL=`-- STOCKROOM v1 · 새 Supabase 프로젝트에서 SQL Editor로 실행
-- 공개키만 HTML에 입력하세요. 아래 SQL을 GitHub에서 자동 실행하지 않습니다.
begin;
create table if not exists public.inv_members (
  user_id uuid primary key references auth.users(id) on delete cascade,
  role text not null check (role in ('admin','editor','viewer'))
);
create table if not exists public.inv_state (
  id text primary key check(id='main'),
  data jsonb not null,
  revision bigint not null default 0,
  updated_at timestamptz not null default now()
);
create table if not exists public.inv_audit (
  id bigint generated always as identity primary key,
  request_id uuid unique not null,
  user_id uuid not null,
  at timestamptz not null default now(),
  revision bigint not null,
  action text not null,
  summary text not null
);
insert into public.inv_state(id,data) values('main',
' {"schema":1,"items":[],"lots":[],"entries":[],"reports":[],"files":[],"audit":[]} '::jsonb)
on conflict(id) do nothing;

alter table public.inv_members enable row level security;
alter table public.inv_state enable row level security;
alter table public.inv_audit enable row level security;
revoke all on public.inv_members,public.inv_state,public.inv_audit from anon,authenticated;
grant select on public.inv_members,public.inv_state,public.inv_audit to authenticated;

create or replace function public.inv_has_access() returns boolean
language sql stable security definer set search_path = '' as $$
  select exists(select 1 from public.inv_members where user_id=auth.uid())
$$;
revoke all on function public.inv_has_access() from public,anon;
grant execute on function public.inv_has_access() to authenticated;
drop policy if exists inv_member_self on public.inv_members;
create policy inv_member_self on public.inv_members for select to authenticated using(user_id=auth.uid());
drop policy if exists inv_read on public.inv_state;
create policy inv_read on public.inv_state for select to authenticated using(public.inv_has_access());
drop policy if exists inv_audit_read on public.inv_audit;
create policy inv_audit_read on public.inv_audit for select to authenticated using(public.inv_has_access());

-- 클라이언트 검증과 별도로 역할·무결성·과거 재고를 서버에서 검사합니다.
create or replace function public.inv_commit(
  p_expected_revision bigint, p_data jsonb, p_action text,
  p_summary text, p_request_id uuid
) returns jsonb language plpgsql security definer set search_path = '' as $$
declare
  v_role text; v_old jsonb; v_rev bigint; v_at timestamptz;
  v_obj jsonb; v_other jsonb; v_id text; v_kind text; v_key text;
  v_balance numeric; v_delta numeric; v_qty numeric; v_code text;
  v_seen text[]:=array[]::text[]; v_codes text[]:=array[]::text[];
  v_email text; v_signature text; v_exhaust text; v_ever boolean;
  v_in numeric; v_out numeric; v_adj numeric; v_size bigint:=0;
begin
  select role into v_role from public.inv_members where user_id=auth.uid();
  if v_role is null or v_role='viewer' then raise exception 'FORBIDDEN'; end if;
  if p_action is null or p_action not in ('entry','item','adjust','cancel','report') then raise exception 'ACTION_NOT_ALLOWED'; end if;
  if p_action in ('item','adjust','cancel') and v_role<>'admin' then raise exception 'ADMIN_REQUIRED'; end if;
  select data,revision into v_old,v_rev from public.inv_state where id='main' for update;
  if exists(select 1 from public.inv_audit where request_id=p_request_id and user_id=auth.uid()) then
    return (select jsonb_build_object('data',data,'revision',revision,'updated_at',updated_at) from public.inv_state where id='main');
  end if;
  if v_rev is distinct from p_expected_revision then raise exception 'CONFLICT: 최신 데이터에서 다시 등록하세요.'; end if;
  if p_data->'schema' is distinct from '1'::jsonb or octet_length(p_data::text)>12582912 then raise exception 'BAD_SCHEMA_OR_SIZE'; end if;
  foreach v_key in array array['items','lots','entries','reports','files','audit'] loop
    if jsonb_typeof(p_data->v_key) is distinct from 'array' then raise exception 'BAD_ARRAY'; end if;
  end loop;
  if jsonb_array_length(p_data->'items')>1000 or jsonb_array_length(p_data->'lots')>3000 or jsonb_array_length(p_data->'entries')>20000 or jsonb_array_length(p_data->'reports')>5000 then raise exception 'LIMIT_EXCEEDED'; end if;
  foreach v_key in array array['items','lots','entries','reports','files'] loop
    for v_obj in select value from jsonb_array_elements(p_data->v_key) loop
      v_id:=v_obj->>'id';
      if v_id is null or v_id !~ '^[a-zA-Z0-9-]{8,80}$' or v_id=any(v_seen) then raise exception 'BAD_OR_DUPLICATE_ID'; end if;
      v_seen:=array_append(v_seen,v_id);
    end loop;
  end loop;
  -- 누적 배열은 끝에만 추가. 기존 이력·파일·보고는 삭제/덮어쓰기 금지.
  foreach v_key in array array['items','lots','entries','reports','files','audit'] loop
    if jsonb_array_length(p_data->v_key)<jsonb_array_length(v_old->v_key) then raise exception 'DELETION_BLOCKED'; end if;
    for v_obj,v_id in select value,(ordinality-1)::text from jsonb_array_elements(v_old->v_key) with ordinality loop
      v_other:=(p_data->v_key)->(v_id::integer);
      if v_key='entries' then
        if (v_obj - array['canceledAt','cancelReason','canceledBy']) is distinct from (v_other - array['canceledAt','cancelReason','canceledBy']) then raise exception 'ENTRY_IMMUTABLE'; end if;
        if v_obj is distinct from v_other then
          if p_action<>'cancel' or v_role<>'admin' or coalesce(v_obj->>'canceledAt','')<>'' or coalesce(v_other->>'canceledAt','')='' or length(trim(coalesce(v_other->>'cancelReason','')))=0 then raise exception 'BAD_CANCEL'; end if;
        end if;
      elsif v_key='items' then
        if v_other->>'id' is distinct from v_obj->>'id' or (v_other is distinct from v_obj and (p_action<>'item' or v_role<>'admin')) then raise exception 'ITEM_EDIT_FORBIDDEN'; end if;
        if v_other->>'unit' is distinct from v_obj->>'unit' and exists(select 1 from jsonb_array_elements(v_old->'lots') l where l->>'itemId'=v_obj->>'id') then raise exception 'UNIT_IMMUTABLE'; end if;
      elsif v_obj is distinct from v_other then raise exception 'HISTORY_IMMUTABLE';
      end if;
    end loop;
  end loop;
  if jsonb_array_length(p_data->'items')>jsonb_array_length(v_old->'items') and p_action<>'item' then raise exception 'ITEM_ACTION_REQUIRED'; end if;
  if jsonb_array_length(p_data->'lots')>jsonb_array_length(v_old->'lots') and p_action<>'entry' then raise exception 'LOT_ACTION_REQUIRED'; end if;
  if jsonb_array_length(p_data->'reports')>jsonb_array_length(v_old->'reports') and p_action<>'report' then raise exception 'REPORT_ACTION_REQUIRED'; end if;
  if jsonb_array_length(p_data->'entries')>jsonb_array_length(v_old->'entries') and p_action not in ('entry','adjust') then raise exception 'ENTRY_ACTION_REQUIRED'; end if;
  select email into v_email from auth.users where id=auth.uid();
  for v_obj in select value from jsonb_array_elements(p_data->'items') loop
    if jsonb_typeof(v_obj->'code') is distinct from 'string' or jsonb_typeof(v_obj->'name') is distinct from 'string' or jsonb_typeof(v_obj->'unit') is distinct from 'string' or jsonb_typeof(v_obj->'minThreshold') is distinct from 'number' then raise exception 'BAD_ITEM_TYPES'; end if;
    v_code:=lower(trim(v_obj->>'code'));
    if coalesce(length(v_code),0) not between 1 and 40 or v_code=any(v_codes) or coalesce(length(trim(v_obj->>'name')),0) not between 1 and 100 or coalesce(length(v_obj->>'unit'),0) not between 1 and 20 or (v_obj->>'minThreshold') !~ '^[0-9]+$' or (v_obj->>'minThreshold') is null or (v_obj->>'minThreshold')::numeric>100000000 or jsonb_typeof(v_obj->'enabled') is distinct from 'boolean' then raise exception 'BAD_ITEM'; end if;
    v_codes:=array_append(v_codes,v_code);
  end loop;
  for v_obj in select value from jsonb_array_elements(p_data->'lots') loop
    if not exists(select 1 from jsonb_array_elements(p_data->'items') i where i->>'id'=v_obj->>'itemId') or coalesce(length(trim(v_obj->>'label')),0) not between 1 and 100 then raise exception 'BAD_LOT'; end if;
    if (v_obj->>'contractDate') !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' or (v_obj->>'contractDate') is null or (v_obj->>'contractDate')::date > (now() at time zone 'Asia/Seoul')::date then raise exception 'BAD_CONTRACT_DATE'; end if;
    if jsonb_typeof(v_obj->'unitPrice') is distinct from 'number' or (v_obj->>'unitPrice') is null or (v_obj->>'unitPrice')::numeric<0 or (v_obj->>'unitPrice')::numeric>10000000000 then raise exception 'BAD_PRICE'; end if;
  end loop;
  for v_obj in select value from jsonb_array_elements(p_data->'entries') loop
    select value into v_other from jsonb_array_elements(p_data->'lots') where value->>'id'=v_obj->>'lotId';
    if v_other is null then raise exception 'ENTRY_LOT_MISSING'; end if;
    v_kind:=v_obj->>'type';
    if jsonb_typeof(v_obj->'quantity') is distinct from 'number' or v_kind is null or v_kind not in ('in','out','adjust') or (v_obj->>'quantity') is null or (v_obj->>'quantity') !~ '^-?[0-9]+$' then raise exception 'BAD_QUANTITY'; end if;
    v_qty:=(v_obj->>'quantity')::numeric;
    if abs(v_qty)>100000000 or (v_kind<>'adjust' and v_qty<=0) then raise exception 'BAD_QUANTITY'; end if;
    if (v_obj->>'date') is null or (v_obj->>'date') !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' or (v_obj->>'date')::date>(now() at time zone 'Asia/Seoul')::date or v_obj->>'date'<v_other->>'contractDate' then raise exception 'BAD_ENTRY_DATE'; end if;
    if (v_obj->>'createdAt') is null or (v_obj->>'createdAt') !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}T' then raise exception 'BAD_TIMESTAMP'; end if;
    perform (v_obj->>'createdAt')::timestamptz;
    if v_kind='adjust' and (jsonb_typeof(v_obj->'physicalCount') is distinct from 'number' or jsonb_typeof(v_obj->'bookBefore') is distinct from 'number' or coalesce(length(trim(v_obj->>'reason')),0)=0 or coalesce(length(trim(v_obj->>'approver')),0)=0 or (v_obj->>'physicalCount') is null or (v_obj->>'bookBefore') is null or (v_obj->>'physicalCount') !~ '^[0-9]+$' or (v_obj->>'bookBefore') !~ '^[0-9]+$' or (v_obj->>'physicalCount')::numeric-(v_obj->>'bookBefore')::numeric<>v_qty) then raise exception 'BAD_ADJUSTMENT'; end if;
    if coalesce(v_obj->>'attachmentId','')<>'' and not exists(select 1 from jsonb_array_elements(p_data->'files') f where f->>'id'=v_obj->>'attachmentId') then raise exception 'FILE_MISSING'; end if;
    if not exists(select 1 from jsonb_array_elements(v_old->'entries') e where e->>'id'=v_obj->>'id') then
      if coalesce(v_obj->>'canceledAt','')<>'' or v_obj->>'actor' is distinct from v_email then raise exception 'BAD_NEW_ENTRY'; end if;
      if (p_action='adjust') is distinct from (v_kind='adjust') then raise exception 'ENTRY_TYPE_FORBIDDEN'; end if;
    end if;
  end loop;
  -- 시간순 잔액 검증: 최종 잔액이 양수여도 중간 음수는 거부합니다.
  for v_obj in select value from jsonb_array_elements(p_data->'lots') loop
    v_balance:=0;
    for v_other in select value from jsonb_array_elements(p_data->'entries') e where e->>'lotId'=v_obj->>'id' and coalesce(e->>'canceledAt','')='' order by e->>'date',e->>'createdAt',e->>'id' loop
      if v_other->>'type'='adjust' and v_balance is distinct from (v_other->>'bookBefore')::numeric then raise exception 'STOCKTAKE_BASE_CHANGED'; end if;
      v_delta:=(v_other->>'quantity')::numeric * case when v_other->>'type'='out' then -1 else 1 end;
      v_balance:=v_balance+v_delta;
      if v_balance<0 or v_balance>100000000 then raise exception 'NEGATIVE_OR_EXCESS_STOCK'; end if;
    end loop;
    if v_balance>0 and exists(select 1 from jsonb_array_elements(p_data->'items') i where i->>'id'=v_obj->>'itemId' and i->>'enabled'='false') then raise exception 'STOCK_ON_DISABLED_ITEM'; end if;
  end loop;
  for v_obj in select value from jsonb_array_elements(p_data->'reports') loop
    if not exists(select 1 from jsonb_array_elements(p_data->'lots') l where l->>'id'=v_obj->>'lotId') or coalesce(length(trim(v_obj->>'documentNo')),0)=0 then raise exception 'BAD_REPORT'; end if;
    if (v_obj->>'reportDate') is null or (v_obj->>'reportDate')::date>(now() at time zone 'Asia/Seoul')::date or v_obj->>'reportDate'<v_obj->>'exhaustDate' then raise exception 'BAD_REPORT_DATE'; end if;
    if coalesce(v_obj->>'attachmentId','')<>'' and not exists(select 1 from jsonb_array_elements(p_data->'files') f where f->>'id'=v_obj->>'attachmentId') then raise exception 'FILE_MISSING'; end if;
    if not exists(select 1 from jsonb_array_elements(v_old->'reports') r where r->>'id'=v_obj->>'id') then
      v_balance:=0;v_in:=0;v_out:=0;v_adj:=0;v_ever:=false;v_signature:='';v_exhaust:='';
      for v_other in select value from jsonb_array_elements(p_data->'entries') e where e->>'lotId'=v_obj->>'lotId' and coalesce(e->>'canceledAt','')='' order by e->>'date',e->>'createdAt',e->>'id' loop
        v_qty:=(v_other->>'quantity')::numeric;
        if v_other->>'type'='in' then v_in:=v_in+v_qty; elsif v_other->>'type'='out' then v_out:=v_out+v_qty; else v_adj:=v_adj+v_qty; end if;
        v_delta:=v_qty * case when v_other->>'type'='out' then -1 else 1 end;
        if v_balance>0 and v_balance+v_delta=0 then v_exhaust:=v_other->>'date'; end if;
        v_balance:=v_balance+v_delta;
        if v_balance>0 then v_ever:=true;v_exhaust:=''; end if;
        v_signature:=v_signature || case when v_signature='' then '' else '|' end || (v_other->>'id');
      end loop;
      if v_balance<>0 or not v_ever or jsonb_typeof(v_obj->'inQty') is distinct from 'number' or jsonb_typeof(v_obj->'outQty') is distinct from 'number' or jsonb_typeof(v_obj->'adjust') is distinct from 'number' or v_obj->>'signature' is distinct from v_signature or v_obj->>'exhaustDate' is distinct from v_exhaust or (v_obj->>'inQty')::numeric is distinct from v_in or (v_obj->>'outQty')::numeric is distinct from v_out or (v_obj->>'adjust')::numeric is distinct from v_adj or v_obj->>'actor' is distinct from v_email then raise exception 'REPORT_EVIDENCE_MISMATCH'; end if;
    end if;
  end loop;
  for v_obj in select value from jsonb_array_elements(p_data->'files') loop
    if jsonb_typeof(v_obj->'size') is distinct from 'number' or coalesce(length(v_obj->>'name'),0) not between 1 and 200 or (v_obj->>'data') is null or (v_obj->>'data') !~ '^data:application/pdf;base64,JVBERi0' or length(v_obj->>'data')>1398204 or (v_obj->>'size') is null or (v_obj->>'size') !~ '^[0-9]+$' or (v_obj->>'size')::bigint not between 1 and 1048576 then raise exception 'BAD_PDF'; end if;
    v_size:=v_size+length(v_obj->>'data');
  end loop;
  if v_size>8388608 then raise exception 'PDF_TOTAL_EXCEEDED'; end if;
  update public.inv_state set data=p_data,revision=v_rev+1,updated_at=clock_timestamp() where id='main' returning updated_at into v_at;
  insert into public.inv_audit(request_id,user_id,revision,action,summary) values(p_request_id,auth.uid(),v_rev+1,p_action,left(p_summary,500));
  return jsonb_build_object('data',p_data,'revision',v_rev+1,'updated_at',v_at);
end $$;
revoke all on function public.inv_commit(bigint,jsonb,text,text,uuid) from public,anon;
grant execute on function public.inv_commit(bigint,jsonb,text,text,uuid) to authenticated;

-- 아래 이메일을 실제 관리자 계정으로 바꾸세요. 계정은 Auth에 먼저 생성합니다.
insert into public.inv_members(user_id,role)
select id,'admin' from auth.users where lower(email)=lower('admin@example.com')
on conflict(user_id) do update set role=excluded.role;
commit;
-- SQL 완료 후 inv_members에 관리자 행이 있는지 확인하세요.
-- 추가 사용자는 안내의 사용자 권한 SQL을 이용합니다.`;
async function boot(){try{config=readJSON('stockroom-config-v1')||clone(DEPLOY_CONFIG);const preferred=localStorage.getItem('stockroom-mode-v1');mode=preferred==='cloud'||(!preferred&&DEPLOY_CONFIG.url&&DEPLOY_CONFIG.key)?'cloud':'local';db=await openDB();if(mode==='local'){const r=await localRead();validate(r.data);adopt(r);role='admin'}else{session=readJSON('stockroom-session-v1',sessionStorage);role=null;if(session&&config.url&&config.key){try{const m=await api('/rest/v1/inv_members?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=role');assert(m.length,'사용자 권한이 없습니다.');role=m[0].role;adopt(await cloudRead())}catch(e){cloudError=errorMsg(e)}}}navigator.storage?.persist?.().catch(()=>{});render()}catch(e){bootError=errorMsg(e);render()}setInterval(()=>{if(document.visibilityState==='visible')sync()},20000)}
boot();
</script>
